<title>군웅할거</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="190년 반동탁 연합부터 시작하는 삼국 시대 턴제 전략 게임">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Song+Myung&family=Gowun+Dodum&display=swap">
<style>
/* 배치: 한 화면 앱 — 위 막대 + (비단 지도 | 오른쪽 문서 패널), 좁으면 아래 서랍 */
:root{
  --ink:#121b20;      /* 먹빛 바탕 */
  --lacq:#1b2a30;     /* 옻칠 패널 */
  --lacq2:#24363d;
  --line:#3a4f55;
  --paper:#eee3c8;    /* 글자: 바랜 종이 */
  --muted:#a59d88;
  --brass:#c9a24a;    /* 놋쇠 강조 */
  --cinnabar:#c4472f; /* 인주 */
  --jade:#5fa585;
  --silk:#d9c9a3;     /* 지도 비단 */
  --f-disp:'Song Myung','Nanum Myeongjo','Noto Serif KR',serif;
  --f-body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
  color-scheme:dark;
}
html,body{height:100%;}
[hidden]{display:none!important;}
body{margin:0;background:var(--ink);color:var(--paper);font:15px/1.5 var(--f-body);overflow:hidden;-webkit-tap-highlight-color:transparent;}
button{font:inherit;color:inherit;}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
section{flex:1;min-height:0;display:flex;flex-direction:column;}
.disp{font-family:var(--f-disp);font-weight:400;}
.btn{background:var(--lacq2);border:1px solid var(--line);border-radius:6px;padding:8px 14px;cursor:pointer;line-height:1.25;transition:background .12s,border-color .12s;touch-action:manipulation;}
.btn:hover{border-color:var(--brass);}
.btn:focus-visible{outline:2px solid var(--brass);outline-offset:2px;}
.btn:disabled{opacity:.4;cursor:default;border-color:var(--line);}
.btn.pri{background:var(--brass);color:#1b1408;border-color:var(--brass);font-weight:700;}
.btn.red{background:var(--cinnabar);border-color:var(--cinnabar);color:#fff;}
.btn.sm{padding:5px 9px;font-size:13px;}
.btn.ghost{background:transparent;}
.muted{color:var(--muted);}
.num{font-variant-numeric:tabular-nums;}

/* 제목 화면 */
#scrTitle{align-items:center;justify-content:center;gap:28px;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));position:relative;overflow:hidden;}
#titleBg{position:absolute;inset:0;width:100%;height:100%;}
.titleBox{position:relative;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;}
.titleBox h1{font-family:var(--f-disp);font-size:clamp(54px,12vw,112px);margin:0;letter-spacing:.08em;color:var(--paper);text-shadow:0 4px 30px rgba(0,0,0,.6);line-height:1;}
.titleBox .han{font-family:var(--f-disp);color:var(--brass);letter-spacing:.6em;font-size:18px;margin-left:.6em;}
.titleBox .sub{color:var(--muted);font-size:14px;}
.seal{display:inline-grid;place-items:center;width:46px;height:46px;background:var(--cinnabar);color:#fff4ea;font-family:var(--f-disp);font-size:20px;border-radius:4px;transform:rotate(-4deg);line-height:1;box-shadow:0 2px 0 rgba(0,0,0,.4);}
.titleMenu{position:relative;display:flex;flex-direction:column;gap:10px;width:min(300px,100%);}
.titleMenu .btn{padding:12px;font-size:16px;}
.ver{position:absolute;bottom:10px;right:16px;color:var(--muted);font-size:12px;}

/* 설정 화면 */
#scrSetup{overflow:auto;padding:20px max(16px,env(safe-area-inset-left,0px)) 24px max(16px,env(safe-area-inset-right,0px));}
.setupInner{max-width:1080px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:16px;}
.setupInner h2{font-family:var(--f-disp);font-size:30px;margin:0;font-weight:400;}
.modeCards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;}
.modeCard{background:var(--lacq);border:1px solid var(--line);border-radius:8px;padding:16px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px;}
.modeCard:hover,.modeCard.on{border-color:var(--brass);}
.modeCard b{font-family:var(--f-disp);font-size:21px;font-weight:400;color:var(--brass);}
.tabs{display:flex;gap:6px;flex-wrap:wrap;}
.tab{padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:6px;}
.tab.on{background:var(--paper);color:var(--ink);border-color:var(--paper);}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.4);}
.ofGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;}
.ofCard{display:flex;gap:10px;background:var(--lacq);border:1px solid var(--line);border-radius:8px;padding:8px;cursor:pointer;text-align:left;align-items:center;}
.ofCard:hover{border-color:var(--brass);}
.ofCard .pt{width:48px;height:56px;border-radius:4px;flex:none;}
.ofCard .nm{font-family:var(--f-disp);font-size:18px;}
.stats5{display:flex;gap:7px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap;}
.stats5 i{font-style:normal;color:var(--paper);}

/* 게임 화면 */
#top{display:flex;align-items:center;gap:10px;padding:6px max(10px,env(safe-area-inset-right,0px)) 6px max(10px,env(safe-area-inset-left,0px));background:var(--lacq);border-bottom:1px solid var(--line);flex-wrap:wrap;}
#top .date{font-family:var(--f-disp);font-size:20px;white-space:nowrap;}
#top .who{display:flex;align-items:center;gap:8px;min-width:0;}
#top .who img{width:30px;height:35px;border-radius:3px;}
#top .who .r{font-size:12px;color:var(--brass);border:1px solid var(--brass);padding:0 6px;border-radius:3px;}
#top .sp{flex:1;}
#top .res{font-size:13px;color:var(--muted);white-space:nowrap;}
#top .res b{color:var(--paper);font-weight:400;}
#main{flex:1;min-height:0;display:flex;}
#mapWrap{flex:1;min-width:0;position:relative;background:#0d1417;}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;}
.mapBtns{position:absolute;left:10px;bottom:10px;display:flex;flex-direction:column;gap:6px;}
.mapBtns .btn{width:38px;height:38px;padding:0;font-size:18px;opacity:.92;}
.legend{position:absolute;left:58px;bottom:10px;background:rgba(18,27,32,.82);border:1px solid var(--line);border-radius:6px;padding:6px 9px;font-size:12px;display:flex;gap:10px;flex-wrap:wrap;max-width:calc(100% - 80px);}
#side{width:360px;flex:none;background:var(--lacq);border-left:1px solid var(--line);overflow:auto;display:flex;flex-direction:column;}
.pane{padding:12px 14px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line);}
.pane h3{margin:0;font-family:var(--f-disp);font-weight:400;font-size:22px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
.pane h3 small{font-size:13px;color:var(--muted);font-family:var(--f-body);}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 10px;font-size:13px;}
.kv div{display:flex;justify-content:space-between;gap:6px;border-bottom:1px dotted rgba(165,157,136,.25);padding:2px 0;}
.kv span{color:var(--muted);}
.kv b{font-weight:400;font-variant-numeric:tabular-nums;}
.bar{height:5px;background:#0f171a;border-radius:3px;overflow:hidden;}
.bar i{display:block;height:100%;background:var(--brass);}
.cmdGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.cmdGrid .btn{padding:8px 4px;font-size:14px;}
.offList{display:flex;flex-direction:column;gap:4px;}
.offRow{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:5px;cursor:pointer;border:1px solid transparent;background:none;text-align:left;width:100%;}
.offRow:hover{border-color:var(--line);background:var(--lacq2);}
.offRow img{width:28px;height:33px;border-radius:3px;flex:none;}
.offRow .n{min-width:64px;}
.offRow .tag{font-size:11px;padding:0 5px;border-radius:3px;border:1px solid var(--line);color:var(--muted);}
.offRow .tag.g{color:var(--brass);border-color:var(--brass);}
.offRow .s{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;gap:6px;}
.offRow.acted{opacity:.5;}
.apDots{display:inline-flex;gap:4px;}
.apDots i{width:10px;height:10px;border-radius:50%;background:var(--brass);display:inline-block;}
.apDots i.off{background:#3a4a4f;}
.log{font-size:13px;display:flex;flex-direction:column;gap:3px;max-height:220px;overflow:auto;}
.log div{display:flex;gap:8px;}
.log .t{color:var(--muted);flex:none;width:52px;font-variant-numeric:tabular-nums;}
.log .big{color:var(--brass);}
.log .war{color:#e6b8a8;}
.log .dip{color:#9fd3bd;}
.endTurn{position:sticky;bottom:0;padding:10px 14px;background:var(--lacq);border-top:1px solid var(--line);display:flex;gap:8px;margin-top:auto;}
.endTurn .btn{flex:1;padding:11px;font-size:16px;}

/* 모달 */
#modalLayer{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(5,9,11,.62);padding:16px;}
#modalLayer.on{display:flex;}
.modal{background:var(--lacq);border:1px solid var(--brass);border-radius:10px;max-width:560px;width:100%;max-height:calc(100% - 16px);overflow:auto;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.6);}
.modal.wide{max-width:820px;}
.modal header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);}
.modal header h4{margin:0;font-family:var(--f-disp);font-weight:400;font-size:22px;flex:1;}
.modal .body{padding:14px 16px;display:flex;flex-direction:column;gap:12px;}
.modal .msg{display:flex;gap:14px;align-items:flex-start;white-space:pre-line;}
.modal .msg img{width:84px;height:98px;border-radius:5px;flex:none;}
.modal footer{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap;justify-content:flex-end;}
.modal footer.col{flex-direction:column;}
.modal footer.col .btn{width:100%;}
.pickList{display:flex;flex-direction:column;gap:4px;max-height:46vh;overflow:auto;}
.pickList .offRow.on{border-color:var(--brass);background:var(--lacq2);}
.slider{display:flex;align-items:center;gap:10px;}
.slider input{flex:1;accent-color:var(--brass);}
label.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);}
input[type=text],select{background:var(--ink);border:1px solid var(--line);color:var(--paper);border-radius:6px;padding:8px 10px;font:inherit;}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--paper);color:var(--ink);padding:9px 16px;border-radius:8px;z-index:60;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center;}
#toast.on{opacity:1;}
#busy{position:fixed;inset:0;z-index:45;display:none;align-items:flex-end;justify-content:center;padding-bottom:80px;pointer-events:all;}
#busy.on{display:flex;}
#busy span{background:rgba(18,27,32,.9);border:1px solid var(--line);padding:8px 16px;border-radius:999px;font-size:14px;}

/* 전투 */
#scrBattle{background:#0d1417;}
#btop{display:flex;align-items:center;gap:10px;padding:6px max(10px,env(safe-area-inset-right,0px)) 6px max(10px,env(safe-area-inset-left,0px));background:var(--lacq);border-bottom:1px solid var(--line);flex-wrap:wrap;}
#btop .ttl{font-family:var(--f-disp);font-size:19px;}
#btop .sp{flex:1;}
#btop .food{font-size:13px;color:var(--muted);}
#bmain{flex:1;min-height:0;position:relative;}
#bcv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;}
#bpanel{position:absolute;left:0;right:0;bottom:0;background:rgba(27,42,48,.95);border-top:1px solid var(--line);padding:8px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));display:flex;gap:12px;align-items:center;flex-wrap:wrap;min-height:58px;}
#bpanel .uinfo{display:flex;gap:10px;align-items:center;min-width:0;flex:1 1 260px;}
#bpanel .uinfo img{width:40px;height:47px;border-radius:4px;}
#bpanel .acts{display:flex;gap:6px;flex-wrap:wrap;}
#blog{position:absolute;right:10px;top:10px;width:min(330px,60%);max-height:34%;overflow:hidden;display:flex;flex-direction:column;gap:3px;pointer-events:none;}
#blog div{background:rgba(18,27,32,.8);padding:3px 9px;border-radius:5px;font-size:13px;animation:fadeLog 7s forwards;}
#blog .good{color:#bfe8d3;} #blog .bad{color:#f1b8a6;} #blog .big{color:var(--brass);}
@keyframes fadeLog{0%,80%{opacity:1}100%{opacity:0}}
.duel{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;}
.duel .side{display:flex;flex-direction:column;align-items:center;gap:6px;}
.duel .side img{width:96px;height:112px;border-radius:6px;}
.duel .hp{width:100%;height:10px;background:#0f171a;border-radius:5px;overflow:hidden;}
.duel .hp i{display:block;height:100%;background:var(--cinnabar);transition:width .35s;}
.duel .vs{font-family:var(--f-disp);font-size:30px;color:var(--brass);}
.scene{display:flex;flex-direction:column;gap:12px;}
.scene .eyebrow{font-size:12px;letter-spacing:.12em;color:var(--brass);}
.scene .nar{margin:0;color:var(--muted);font-size:14px;line-height:1.7;max-width:62ch;}
.scene .sline{display:flex;gap:12px;align-items:flex-start;}
.scene .sline img{width:52px;height:61px;border-radius:4px;flex:none;}
.scene .say{background:var(--lacq2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-width:0;}
.scene .say b{font-weight:400;font-size:16px;color:var(--brass);}
.scene .say p{margin:2px 0 0;line-height:1.65;}
.duelLog{min-height:64px;font-size:14px;display:flex;flex-direction:column;gap:2px;}

@media (max-width:760px){
  #main{flex-direction:column;}
  #side{width:auto;border-left:0;border-top:1px solid var(--line);height:46%;flex:none;}
  .cmdGrid{grid-template-columns:repeat(4,1fr);}
  #top .res{display:none;}
  .legend{display:none;}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}
</style>

<div id="app">
  <section id="scrTitle">
    <canvas id="titleBg"></canvas>
    <div class="titleBox">
      <span class="seal">群雄</span>
      <h1>군웅할거</h1>
      <div class="han">群雄割據</div>
      <div class="sub">190년, 반동탁 연합. 천하는 아직 누구의 것도 아니다.</div>
    </div>
    <div class="titleMenu">
      <button class="btn pri" id="bNew">새로 시작</button>
      <button class="btn" id="bCont" hidden>이어 하기</button>
      <button class="btn" id="bLoad">불러오기</button>
      <button class="btn ghost" id="bHelp">하는 법</button>
    </div>
    <div class="ver" id="verTxt"></div>
  </section>

  <section id="scrSetup" hidden><div class="setupInner" id="setupInner"></div></section>

  <section id="scrGame" hidden>
    <header id="top"></header>
    <div id="main">
      <div id="mapWrap">
        <canvas id="map"></canvas>
        <div class="mapBtns">
          <button class="btn" id="zIn" aria-label="확대">+</button>
          <button class="btn" id="zOut" aria-label="축소">−</button>
          <button class="btn" id="zMe" aria-label="내 위치">◎</button>
        </div>
        <div class="legend" id="legend"></div>
      </div>
      <aside id="side"></aside>
    </div>
  </section>

  <section id="scrBattle" hidden>
    <header id="btop"></header>
    <div id="bmain"><canvas id="bcv"></canvas><div id="blog"></div><div id="bpanel"></div></div>
  </section>
</div>
<div id="modalLayer"></div>
<div id="busy"><span>다른 세력이 움직이는 중…</span></div>
<div id="toast"></div>
<!--JS-->
