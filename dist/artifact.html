// ===== 한 달 진행 =====
let BUSY = false;
async function endMonth() {
  if (BUSY || G.over) return;
  BUSY = true; UI.busy(true);
  try {
    // 1) AI 내정
    for (const c of G.cities) if (c.f >= 0 && !playerControls(c)) aiCityTurn(c);
    // 2) AI 외교·물자
    for (const F of G.factions) if (F.alive && !(isRuler(me()) && me().f === F.id)) { aiDiplomacy(F); aiLogistics(F); }
    if (isRuler(me())) { for (const c of G.cities) if (c.f === me().f && c.deleg) aiCityTurn(c); aiLogisticsDeleg(); }
    // 3) 출진
    let plans = [];
    for (const F of shuffle(G.factions.filter(f => f.alive))) {
      if (isRuler(me()) && me().f === F.id) { plans.push(...aiPlanAttacks(F).filter(p => p.from.deleg)); continue; }
      plans.push(...aiPlanAttacks(F));
    }
    for (const p of plans) {
      if (p.from.f < 0 || G.officers[p.army[0].oid].city !== p.from.id) continue; // 상황이 바뀜
      if (p.to.f === p.from.f || isAlly(p.from.f, p.to.f)) continue;
      p.army = p.army.filter(u => { const o = G.officers[u.oid]; return o.st === 'on' && o.f === p.from.f && o.city === p.from.id; });
      if (!p.army.length || p.from.troops < p.army.reduce((a, u) => a + u.troops, 0)) continue;
      G.factions[p.from.f].idle = 0;
      await runWar(p.from, p.to, p.army, p.food);
      if (G.over) return;
    }
    for (const F of G.factions) if (F.alive) F.idle = (F.idle || 0) + 1;
    for (const k in G.ally) if (G.ally[k] !== true && G.ally[k] <= mIdx()) { const [a, b] = k.split(',').map(Number); delete G.ally[k]; logMsg(`${facName(a)}군과 ${facName(b)}군의 동맹 기한이 끝났습니다`, 'dip'); }
    checkFactions();
    // 4) 달 넘김
    monthlyEconomy();
    await monthlyEvents();
    G.month++;
    if (G.month > 12) { G.month = 1; G.year++; await yearlyEvents(); }
    for (const o of G.officers) o.acted = false;
    G.ap = 3;
    assignGovs();
    aiOfficersDrift();
    await afterMonthChecks();
    if (!G.over) saveGame('auto');
    SFX.play('gong');
  } catch (e) { console.error(e); UI.toast('오류: ' + e.message); }
  finally { BUSY = false; UI.busy(false); UI.refresh(); }
}
function aiLogisticsDeleg() {
  const F = G.factions[me().f];
  // 위임한 성만: playerControls가 false인 성만 움직이므로 그대로 호출
  aiLogistics(F);
}

// 전쟁 하나를 처리 (플레이어가 끼면 직접 지휘)
async function runWar(from, to, army, food) {
  const defF = to.f;
  const B = launchAttack(from, to, army, food);
  if (!B) { UI.refresh(); return; }
  const P = me();
  const pIn = P && P.st === 'on' && B.units.some(u => u.oid === P.id);
  const pDefends = P && P.st === 'on' && P.f === defF && defF >= 0 && (playerControls(to) || (P.city === to.id));
  const pAttacks = P && P.st === 'on' && P.f === B.attF && (playerControls(from) || pIn);
  if (pIn || pDefends || pAttacks) {
    B.playerSide = (P.f === B.attF) ? 0 : 1;
    const full = (B.playerSide === 0 && playerControls(from) && (role() === 'ruler' || role() === 'gov')) || (B.playerSide === 1 && playerControls(to));
    B.ctrl = u => u.side === B.playerSide && (full || u.oid === P.id);
    if (!full && !pIn && B.playerSide === 1) { // 지켜보기만
      B.ctrl = () => false;
    }
    await UI.alert({ title: B.playerSide === 0 ? '출진' : '적의 침공!', text: B.playerSide === 0 ? `${facName(B.attF)}군 ${fmt(B.units.filter(u => u.side === 0).reduce((a, u) => a + u.troops, 0))}명이 ${eul(to.name)} 공격합니다.${!full ? '\n당신은 자기 부대만 지휘합니다.' : ''}` : `${facName(B.attF)}군이 ${eul(to.name)} 공격해 왔습니다!${!full && pIn ? '\n당신은 자기 부대만 지휘합니다.' : ''}${!pIn && !full ? '\n싸움을 지켜봅니다.' : ''}` });
    await BattleUI.run(B);
  } else {
    runBattleHeadless(B);
  }
  applyBattle(B);
  await resolveCaptives(B);
  if (P && B.playerSide != null) {
    const won = B.result.win === B.playerSide;
    if (won) SFX.play('win'); else SFX.play('lose');
  }
  if (P && (pIn || pDefends || pAttacks)) {
    await UI.alert({ title: B.result.win === B.playerSide ? '승리' : '패배', text: `${to.name} 전투 — ${B.result.why}.` });
  }
  checkFactions();
}

function monthlyEconomy() {
  for (const c of G.cities) {
    if (c.f >= 0) {
      c.gold += Math.round(c.comm / 4 + c.pop / 25000);
      c.food -= Math.round(c.troops * .03);
      if (G.month === 7) c.food += Math.round(c.agri * 22 * (.55 + c.order / 220));
      if (c.food < 0) { const loss = Math.round(c.troops * .12); c.troops -= loss; c.food = 0; if (c.f === me()?.f) logMsg(`${c.name}에 군량이 떨어져 병사 ${fmt(loss)}명이 달아났습니다`, 'bad'); }
      if (c.gold > 30000) c.gold = 30000;
    } else {
      c.gold += 20; if (G.month === 7) c.food += Math.round(c.agri * 8);
    }
    c.pop = Math.round(c.pop * (1 + (c.order - 45) / 6000));
    if (chance(.3)) c.order = clamp(c.order + (c.order > 60 ? -1 : 0) + (c.troops > 2000 ? 0 : -1), 0, 100);
    c.troops = Math.max(0, c.troops);
  }
  // 충성 흐름
  for (const o of G.officers) {
    if (o.st !== 'on' || isRuler(o) || o.id === G.player) continue;
    const r = G.officers[G.factions[o.f].ruler];
    if (o.tag && o.tag === r.tag) { o.loy = 100; continue; }
    const drift = (r.cha - 65) / 40 - affDist(o, r) / 40;
    if (chance(.4)) o.loy = clamp(Math.round(o.loy + drift + (chance(.5) ? 0 : -1)), 0, 100);
  }
  // 플레이어 봉록
  const P = me();
  if (P && P.st === 'on') G.pgold += isRuler(P) ? 0 : 20 + Math.floor(P.merit / 100);
}

async function monthlyEvents() {
  // 동맹 제의
  const offers = G.pendingOffers || []; G.pendingOffers = [];
  for (const of of offers) {
    if (!isRuler(me())) break;
    const F = G.factions[of.from]; if (!F.alive || isAlly(F.id, me().f)) continue;
    const ch = await UI.choose({ title: '동맹 제의', portrait: G.officers[F.ruler], text: `${F.name}군의 사자가 왔습니다. "우리 두 나라가 3년 동안 손을 잡는 것이 어떻겠습니까?"`, options: [{ k: 'y', label: '동맹을 맺는다' }, { k: 'n', label: '거절한다' }] });
    if (ch === 'y') { makeAlly(F.id, me().f); logMsg(`${F.name}군과 동맹을 맺었습니다`, 'dip'); }
    else addRel(F.id, me().f, -8);
  }
  // 태수 임명 알림
  const P = me();
  if (P && P.st === 'on' && !isRuler(P)) {
    const c = G.cities[P.city];
    if (c.gov !== P.id) {
      const gov = c.gov >= 0 ? G.officers[c.gov] : null;
      if (P.merit >= 700 && (!gov || (!isRuler(gov) && govScore(P) > govScore(gov) * .95)) && chance(.5)) {
        c.gov = P.id;
        await UI.alert({ title: '태수 임명', portrait: G.officers[G.factions[P.f].ruler], text: `그간의 공을 인정받아 ${c.name} 태수로 임명되었습니다.\n이제 이 성의 내정과 군사를 맡습니다.` });
        logMsg(`${eun(P.name)} ${c.name} 태수가 되었습니다`, 'big');
      }
    }
  }
}

async function yearlyEvents() {
  // 수명
  for (const o of G.officers) {
    if ((o.st === 'on' || o.st === 'ronin') && G.year >= o.die && chance(.65)) {
      const notable = o.id === G.player || isRuler(o) || (me() && o.f === me().f && o.f >= 0);
      killOfficer(o, notable ? `${eun(o.name)} 병으로 세상을 떠났습니다 (향년 ${age(o)}세)` : null);
    }
  }
  // 새 인물 등장
  for (const o of G.officers) {
    if (o.st !== 'unborn' || G.year - o.born < 16) continue;
    const F = o.fk ? G.factions.find(f => f.key === o.fk && f.alive) : null;
    if (F) { o.st = 'on'; o.f = -1; joinFaction(o, F.id, G.officers[F.ruler].city); logMsg(`${eun(o.name)} 자라서 ${F.name}군에 들어왔습니다`); }
    else { o.st = 'ronin'; o.f = -1; o.found = false; }
  }
  checkFactions();
  assignGovs();
}

async function afterMonthChecks() {
  const P = me();
  if (!P || P.st === 'dead') return;
  // 통일
  const alive = G.factions.filter(f => f.alive && G.cities.some(c => c.f === f.id));
  const owned = G.cities.filter(c => c.f >= 0);
  if (alive.length === 1 && owned.length === G.cities.length) {
    const F = alive[0];
    G.over = true;
    const mine = P.st === 'on' && P.f === F.id;
    await UI.alert({ title: mine ? '천하 통일!' : '천하가 정해지다', portrait: G.officers[F.ruler], text: mine ? `${G.year}년 ${G.month}월, ${F.name}군이 천하를 하나로 모았습니다.\n${P.name}의 이름은 길이 전해질 것입니다.` : `${F.name}군이 천하를 통일했습니다.` });
    UI.gameOver(mine);
  }
}

// 플레이어가 죽었을 때
function onPlayerDeath(o, f, wasRuler) {
  if (wasRuler && f >= 0 && G.factions[f].alive) {
    const n = G.officers[G.factions[f].ruler];
    if (n && n.st === 'on') {
      G.player = n.id;
      UI.queue({ title: '대를 잇다', portrait: n, text: `${eun(o.name)} 세상을 떠났습니다. 이제 ${iga(n.name)} 뜻을 이어 세력을 이끕니다.` });
      return;
    }
  }
  UI.queue({ title: '영웅의 죽음', portrait: o, text: `${eun(o.name)} 세상을 떠났습니다.\n다른 인물로 이어서 할 수 있습니다.`, after: () => UI.pickSuccessor() });
}

// ===== 화면: 모달·패널·명령 =====
const STAT_NAMES = { lead: '통솔', war: '무력', int: '지력', pol: '정치', cha: '매력' };
const SEASON = m => m <= 2 || m === 12 ? '겨울' : m <= 5 ? '봄' : m <= 8 ? '여름' : '가을';

const UI = {
  sel: -1, q: [], modalOpen: false,
  toast(t) { const e = $('#toast'); e.textContent = t; e.classList.add('on'); clearTimeout(this._tt); this._tt = setTimeout(() => e.classList.remove('on'), 2200); },
  busy(on) { $('#busy').classList.toggle('on', on); },
  // 모달: 버튼 키를 돌려줌
  modal({ title, portrait, text, body, buttons = [{ k: 'ok', label: '확인', cls: 'pri' }], wide, col, cancel }) {
    return new Promise(res => {
      const layer = $('#modalLayer');
      const done = k => { layer.classList.remove('on'); layer.innerHTML = ''; this.modalOpen = false; document.removeEventListener('keydown', onKey); res(k); };

// 새 세력 만들기 (거병·독립)
function createFaction(P, c, troops, keepCity) {
  const used = new Set(G.factions.filter(f => f.alive).map(f => f.color));
  const palette = ['#d2b04c', '#4fb3a3', '#b2577a', '#7f8fd6', '#d58a5b', '#8fbf5a', '#b98ad6', '#e0e0e0'];
  const color = palette.find(p => !used.has(p)) || '#e0d070';
  const F = { id: G.factions.length, key: 'p' + P.id + '_' + G.year, name: P.name, color, ruler: P.id, alive: true, capital: c.id };
  G.factions.push(F);
  P.st = 'on'; P.f = F.id; P.city = c.id; P.loy = 100; P.merit = Math.max(P.merit, 1000);
  c.f = F.id; c.gov = P.id; c.deleg = false;
  if (!keepCity) { c.troops = Math.max(c.troops, troops); c.train = Math.max(c.train, 40); c.gold += 400; c.food += 3000; c.order = Math.max(c.order, 50); }
  G.factions.forEach(o => { if (o.id !== F.id) G.rel[relKey(o.id, F.id)] = 45; });
  logMsg(`${eun(P.name)} ${c.name}에서 일어나 군주가 되었습니다`, 'big');
  assignGovs();
  return F;
}

const SFX = {
  ctx: null, on: store('gunung.snd') !== '0',
  ensure() { if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { this.on = false; } } if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); return this.ctx; },
  toggle() { this.on = !this.on; store('gunung.snd', this.on ? '1' : '0'); },
  tone(f, t0, dur, type = 'sine', vol = .15, f2) {
    const c = this.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
    g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vol, t0 + .01); g.gain.exponentialRampToValueAtTime(.0005, t0 + dur);
    o.connect(g).connect(c.destination); o.start(t0); o.stop(t0 + dur + .05);
  },
  noise(t0, dur, vol = .2, ftype = 'bandpass', freq = 1200, q = 1, f2) {
    const c = this.ctx, n = Math.floor(c.sampleRate * dur), buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    const s = c.createBufferSource(); s.buffer = buf;
    const fl = c.createBiquadFilter(); fl.type = ftype; fl.frequency.setValueAtTime(freq, t0); if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t0 + dur); fl.Q.value = q;

    s.connect(fl).connect(g).connect(c.destination); s.start(t0);
  },
  play(name) {
    if (!this.on) return;
    const c = this.ensure(); if (!c) return;
    const t = c.currentTime;
    const PENTA = [293.7, 329.6, 370, 440, 493.9, 587.3, 659.3, 740];
    switch (name) {
      case 'tick': this.tone(1400, t, .04, 'square', .03); break;
      case 'step': this.noise(t, .05, .05, 'lowpass', 600); break;
      case 'ok': this.tone(PENTA[3], t, .25, 'triangle', .1); this.tone(PENTA[5], t + .08, .35, 'triangle', .09); break;
      case 'no': this.tone(180, t, .18, 'sine', .14, 120); break;
      case 'gong': [110, 163, 227, 289].forEach((f, i) => this.tone(f, t, 2.2 - i * .3, 'sine', .07 - i * .012)); this.noise(t, .4, .05, 'bandpass', 400); break;

      case 'clash': this.noise(t, .14, .18, 'highpass', 2500); this.tone(1800 + Math.random() * 600, t, .22, 'square', .025); break;
      case 'arrow': this.noise(t, .25, .1, 'bandpass', 3000, 2, 900); break;
      case 'fire': this.noise(t, .9, .2, 'lowpass', 900, 1, 200); for (let i = 0; i < 6; i++) this.noise(t + Math.random() * .7, .03, .08, 'highpass', 3000); break;

          el('div', { class: 'muted', style: 'font-size:13px' }, '나이는 스무 살(170년생)입니다.')),
        el('div', { style: 'display:flex;flex-direction:column;gap:10px;background:var(--lacq);border:1px solid var(--line);border-radius:8px;padding:14px' },
          el('div', { style: 'display:flex;align-items:center;gap:10px' }, el('span', { class: 'muted' }, '능력 합계'), pts, el('button', { class: 'btn sm', style: 'margin-left:auto', onclick: () => { this.roll(); this.spare = 0; drawStats(); SFX.play('tick'); } }, '🎲 다시 굴리기')),
          statBox)),
      el('div', {}, el('button', { class: 'btn pri', style: 'padding:12px 28px;font-size:16px', onclick: () => this.createStart(startSel.value, +citySel.value) }, '이 인물로 시작')));
  },
  createStart(how, cid) {
    const name = (this.name || '').trim();
    if (!/^[가-힣]{2,4}$/.test(name)) { UI.toast('이름은 한글 2~4자로 지어 주세요'); return; }
    if (G.officers.some(o => o.name === name)) { UI.toast('이미 있는 이름입니다'); return; }
    const s = this.stats;
    const o = { id: G.officers.length, name, born: 170, die: 170 + 66 + ri(0, 10), ...s, f: -1, city: cid, loy: 0, merit: 0, fame: 30, st: 'ronin', acted: false, ideal: ri(0, 99), tag: '', found: true, home: cid, fk: '', created: true, bond: {} };
    G.officers.push(o); G.player = o.id; G.pgold = 300;
    if (how === 'rise') { if (G.cities[cid].f >= 0) { UI.toast('빈 땅을 골라 주세요'); return; } createFaction(o, G.cities[cid], 3000); }
    saveGame('auto'); startPlaying(true);
  },
};
function statSpans(o) { return ['lead', 'war', 'int', 'pol', 'cha'].map(k => el('span', {}, STAT_NAMES[k][0], el('i', {}, ' ' + o[k]))); }

    el('p', { style: 'margin:0' }, el('b', {}, '포로 '), '사로잡은 장수는 등용하거나 풀어 주거나 처단합니다. 처단은 같은 세력 장수들의 마음을 흔듭니다.'),
    el('p', { class: 'muted', style: 'margin:0' }, '매달 초 자동 저장됩니다. 메뉴에서 세 칸에 따로 저장할 수 있습니다. 인물과 사건은 역사·연의를 바탕으로 했고, 능력치는 이 게임에서 새로 매겼습니다.')) });
}

function drawTitleBg() {
  const cv = $('#titleBg'), r = cv.getBoundingClientRect(); if (!r.width) return;
  const d = Math.min(2, devicePixelRatio || 1); cv.width = r.width * d; cv.height = r.height * d;
  const x = cv.getContext('2d'); x.scale(d, d);
  const W = r.width, H = r.height;
  const sky = x.createLinearGradient(0, 0, 0, H); sky.addColorStop(0, '#1d2c33'); sky.addColorStop(.6, '#2b3a3c'); sky.addColorStop(1, '#121b20');
  x.fillStyle = sky; x.fillRect(0, 0, W, H);
  x.fillStyle = 'rgba(196,71,47,.85)'; x.beginPath(); x.arc(W * .72, H * .3, Math.min(W, H) * .09, 0, 7); x.fill();
  const R = mulberry(5);
  const layers = [['rgba(60,78,80,.7)', .55, 60], ['rgba(40,55,58,.85)', .66, 80], ['rgba(24,34,38,.95)', .78, 110]];
  for (const [col, base, amp] of layers) {
    x.fillStyle = col; x.beginPath(); x.moveTo(0, H);
    let y = H * base;
    for (let px = 0; px <= W + 20; px += 20) { y = clamp(y + (R() - .5) * amp * .6, H * base - amp, H * base + amp * .4); x.lineTo(px, y - Math.abs(Math.sin(px / (90 + amp))) * amp); }
    x.lineTo(W, H); x.fill();
  }
  // 깃발 행렬
  for (let i = 0; i < 26; i++) { const px = W * .08 + i * W * .033, py = H * .86 + Math.sin(i) * 4; x.strokeStyle = 'rgba(10,14,16,.9)'; x.lineWidth = 1.5; x.beginPath(); x.moveTo(px, py); x.lineTo(px, py - 34); x.stroke(); x.fillStyle = i % 5 === 0 ? 'rgba(196,71,47,.9)' : 'rgba(10,14,16,.9)'; x.fillRect(px, py - 34, 10, 14); }
}

function boot() {
  $('#verTxt').textContent = 'v' + VERSION;
  MapView.init(); BattleUI.init();
  $('#bNew').onclick = () => { SFX.play('gong'); Setup.open(); };
  $('#bCont').onclick = () => { if (loadGame('auto')) startPlaying(false); };
  $('#bLoad').onclick = async () => { G = G || newGame(); const ok = await UI.loadDialog(); if (!ok && !me()) showScreen('scrTitle'); };
  $('#bHelp').onclick = () => showHelp();
  window.addEventListener('resize', () => { if (!$('#scrTitle').hidden) drawTitleBg(); });
  showScreen('scrTitle');
}
boot();
