<title>군웅할거</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="190년 반동탁 연합부터 시작하는 삼국 시대 턴제 전략 게임">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Song+Myung&family=Gowun+Dodum&display=swap">
<style>
/* 배치: 한 화면 앱 — 옻칠 나무 상단바 + (채색 지도 | 놋쇠 테 군막 패널), 좁으면 아래 서랍
   재질: 검붉은 옻칠 나무 틀, 놋쇠 테두리, 먹빛 바탕 위 바랜 종이 글자 */
:root{
  --ink:#0e1417;        /* 먹빛 바탕 */
  --panel:#141e22;      /* 패널 안쪽 */
  --panel2:#1b292e;
  --panel3:#23353b;
  --wood:#3b2219;       /* 옻칠 나무 */
  --wood2:#24130d;
  --line:#33474c;
  --paper:#f0e5c9;      /* 글자: 바랜 종이 */
  --muted:#ab9f86;
  --brass:#d6ad55;      /* 놋쇠 */
  --brass2:#8c6a28;
  --brass3:#f3d991;
  --cinnabar:#c94a30;   /* 인주 */
  --jade:#62ad8a;
  --sky:#7fa7c9;
  --violet:#a98bd0;
  --gold-edge:linear-gradient(135deg,#f6dc93 0%,#9a7430 28%,#e8c56f 52%,#7a5a1e 78%,#d8b465 100%);
  --wood-grain:repeating-linear-gradient(92deg,rgba(255,220,180,.025) 0 2px,transparent 2px 9px),linear-gradient(180deg,#432719,#2a160f);
  --f-disp:'Song Myung','Nanum Myeongjo','Noto Serif KR',serif;
  --f-body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
  color-scheme:dark;
}
html,body{height:100%;}
[hidden]{display:none!important;}
body{margin:0;background:var(--ink);color:var(--paper);font:15px/1.5 var(--f-body);overflow:hidden;-webkit-tap-highlight-color:transparent;}
button{font:inherit;color:inherit;}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
section{flex:1;min-height:0;display:flex;flex-direction:column;}
.disp{font-family:var(--f-disp);font-weight:400;}
.muted{color:var(--muted);}
.num{font-variant-numeric:tabular-nums;}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none;}

/* 버튼: 옻칠 판에 놋쇠 테 */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:6px;background:linear-gradient(180deg,#2a3c42,#18252a);border:1px solid #4b6066;border-radius:6px;padding:8px 14px;cursor:pointer;line-height:1.25;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 2px 0 rgba(0,0,0,.45);transition:filter .12s,border-color .12s,transform .06s;touch-action:manipulation;}
.btn:hover{border-color:var(--brass);filter:brightness(1.12);}
.btn:active{transform:translateY(1px);box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 1px 0 rgba(0,0,0,.45);}
.btn:focus-visible{outline:2px solid var(--brass3);outline-offset:2px;}
.btn:disabled{opacity:.38;cursor:default;filter:grayscale(.6);border-color:#3a4a4f;transform:none;}
.btn.pri{background:linear-gradient(180deg,#f0cf7c,#c49a43 55%,#a37a2c);color:#2a1a06;border-color:#f3d991;font-weight:700;text-shadow:0 1px 0 rgba(255,240,200,.5);}
.btn.red{background:linear-gradient(180deg,#e0664a,#b13c25 60%,#8f2c19);border-color:#f19a80;color:#fff5ec;text-shadow:0 1px 0 rgba(0,0,0,.35);}
.btn.sm{padding:5px 10px;font-size:13px;}
.btn.ghost{background:transparent;box-shadow:none;border-color:transparent;}
.btn.ghost:hover{border-color:var(--line);}

/* 놋쇠 테 틀 */
.frame{border:2px solid transparent;background:linear-gradient(var(--panel),var(--panel)) padding-box,var(--gold-edge) border-box;border-radius:10px;}

/* 제목 화면 */
#scrTitle{align-items:center;justify-content:center;gap:30px;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));position:relative;overflow:hidden;}
#titleBg{position:absolute;inset:0;width:100%;height:100%;}
.titleBox{position:relative;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;}
.titleBox h1{font-family:var(--f-disp);font-size:clamp(58px,13vw,124px);margin:0;letter-spacing:.06em;line-height:1;background:linear-gradient(180deg,#fff3cf 10%,#e8c56f 55%,#a3782c 90%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 rgba(30,12,4,.7)) drop-shadow(0 10px 30px rgba(0,0,0,.6));}
.titleBox .han{font-family:var(--f-disp);color:var(--brass);letter-spacing:.6em;font-size:18px;margin-left:.6em;}
.titleBox .sub{color:var(--paper);opacity:.8;font-size:14px;text-shadow:0 1px 4px #000;}
.seal{display:inline-grid;place-items:center;width:50px;height:50px;background:radial-gradient(circle at 35% 30%,#e0583c,#a8321d);color:#fff4ea;font-family:var(--f-disp);font-size:21px;border-radius:5px;transform:rotate(-5deg);line-height:1;box-shadow:0 2px 0 rgba(0,0,0,.4),inset 0 0 0 2px rgba(255,230,210,.35);}
.titleMenu{position:relative;display:flex;flex-direction:column;gap:10px;width:min(300px,100%);padding:16px;background:rgba(14,20,23,.55);border-radius:12px;backdrop-filter:blur(3px);}
.titleMenu .btn{padding:12px;font-size:16px;}
.ver{position:absolute;bottom:10px;right:16px;color:var(--muted);font-size:12px;}

/* 설정 화면 */
#scrSetup{overflow:auto;padding:20px max(16px,env(safe-area-inset-left,0px)) 24px max(16px,env(safe-area-inset-right,0px));background:radial-gradient(ellipse at 50% 0%,#1d2c31,var(--ink) 70%);}
.setupInner{max-width:1080px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:16px;}
.setupInner h2{font-family:var(--f-disp);font-size:30px;margin:0;font-weight:400;color:var(--brass3);}
.mission{display:flex;gap:10px;align-items:flex-start;margin-top:8px;padding:8px 10px;border:1px solid var(--brass2);border-radius:8px;background:rgba(214,173,85,.07);font-size:13px}
.mission > svg{width:18px;height:18px;flex:none;color:var(--brass);margin-top:2px}
.scenRow{display:flex;gap:8px;flex-wrap:wrap}
.scenCard{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 16px;min-width:130px;border-radius:8px;border:1px solid var(--line);background:linear-gradient(170deg,#203036,#141e22);color:var(--paper);cursor:pointer;font:inherit;text-align:left}
.scenCard b{font-family:var(--f-disp);font-size:18px;font-weight:400}
.scenCard span{font-size:12px;color:var(--muted)}
.scenCard.on{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass) inset,0 0 14px rgba(214,173,85,.3)}
.scenCard:hover{border-color:var(--brass2)}
.modeCards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;}
.modeCard{border:2px solid transparent;background:linear-gradient(170deg,#203036,#141e22) padding-box,var(--gold-edge) border-box;border-radius:10px;padding:18px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px;transition:transform .12s,filter .12s;}
.modeCard:hover,.modeCard.on{transform:translateY(-2px);filter:brightness(1.12);}
.modeCard b{font-family:var(--f-disp);font-size:23px;font-weight:400;color:var(--brass3);}
.tabs{display:flex;gap:6px;flex-wrap:wrap;}
.tab{padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:rgba(27,41,46,.7);cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:6px;}
.tab:hover{border-color:var(--brass);}
.tab.on{background:linear-gradient(180deg,#f0cf7c,#c49a43);color:#2a1a06;border-color:#f3d991;font-weight:700;}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.5);box-shadow:0 0 0 1px rgba(255,255,255,.15);}
.ofGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px;}
.ofCard{display:flex;gap:10px;background:linear-gradient(170deg,#1f2e33,#151f23);border:1px solid var(--line);border-radius:8px;padding:8px;cursor:pointer;text-align:left;align-items:center;transition:border-color .12s,transform .12s;}
.ofCard:hover{border-color:var(--brass);transform:translateY(-1px);}
.ofCard .pt{width:48px;height:56px;border-radius:4px;flex:none;box-shadow:0 0 0 1px var(--brass2);}
.ofCard .nm{font-family:var(--f-disp);font-size:18px;}
.stats5{display:flex;gap:7px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap;}
.stats5 i{font-style:normal;color:var(--paper);}

/* 상단바: 옻칠 나무 */
#top,#btop{display:flex;align-items:center;gap:10px;padding:5px max(10px,env(safe-area-inset-right,0px)) 5px max(10px,env(safe-area-inset-left,0px));background:var(--wood-grain);border-bottom:2px solid transparent;border-image:var(--gold-edge) 1;flex-wrap:wrap;box-shadow:0 3px 12px rgba(0,0,0,.5);position:relative;z-index:2;}
.datePlaque{display:flex;flex-direction:column;align-items:center;line-height:1.05;padding:3px 12px 4px;border-radius:6px;background:linear-gradient(180deg,#1b1009,#2e1a10);box-shadow:inset 0 0 0 1px var(--brass2),0 1px 0 rgba(255,220,160,.08);}
.datePlaque b{font-family:var(--f-disp);font-weight:400;font-size:20px;color:var(--brass3);white-space:nowrap;}
.datePlaque small{font-size:11px;color:var(--muted);white-space:nowrap;letter-spacing:.05em;}
.season{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;font-family:var(--f-disp);font-size:16px;color:#fff6e4;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35),0 1px 3px rgba(0,0,0,.5);}
.season.s1{background:radial-gradient(circle at 35% 30%,#f0a3b5,#b4566c);}
.season.s2{background:radial-gradient(circle at 35% 30%,#8fd18a,#3f8a4b);}
.season.s3{background:radial-gradient(circle at 35% 30%,#f2b46a,#b0602a);}
.season.s4{background:radial-gradient(circle at 35% 30%,#bcd6ec,#5a7f9e);}
#top .who{display:flex;align-items:center;gap:8px;min-width:0;padding:3px 10px 3px 3px;border-radius:999px;background:rgba(0,0,0,.28);border:1px solid rgba(214,173,85,.35);cursor:pointer;}
#top .who:hover{border-color:var(--brass);}
#top .who img{width:32px;height:32px;border-radius:50%;object-fit:cover;object-position:50% 25%;box-shadow:0 0 0 2px var(--brass2);}
.rank{font-size:11px;color:#2a1a06;background:linear-gradient(180deg,#f0cf7c,#c49a43);padding:1px 7px;border-radius:999px;font-weight:700;}
#top .sp,#btop .sp{flex:1;}
.chips{display:flex;gap:6px;flex-wrap:wrap;}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px 3px 6px;border-radius:999px;background:rgba(0,0,0,.32);border:1px solid rgba(214,173,85,.25);font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums;}
.chip .ic{width:16px;height:16px;}
.chip.g .ic{color:var(--brass3);} .chip.f .ic{color:#e6c88a;} .chip.t .ic{color:#e98a72;} .chip.p .ic{color:var(--sky);} .chip.c .ic{color:var(--jade);} .chip.s .ic{color:var(--brass);}
.topBtn{display:inline-flex;flex-direction:column;align-items:center;gap:1px;padding:3px 8px;min-width:44px;border-radius:6px;background:transparent;border:1px solid transparent;cursor:pointer;font-size:11px;color:var(--paper);}
.topBtn .ic{width:20px;height:20px;color:var(--brass3);}
.topBtn:hover{background:rgba(0,0,0,.3);border-color:rgba(214,173,85,.4);}
.topBtn:focus-visible{outline:2px solid var(--brass3);}

#main{flex:1;min-height:0;display:flex;}
#mapWrap{flex:1;min-width:0;position:relative;background:#0b1114;overflow:hidden;}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;}
.mapBtns{position:absolute;left:max(10px,env(safe-area-inset-left,0px));bottom:10px;display:flex;flex-direction:column;gap:8px;}
.medal{width:42px;height:42px;padding:0;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:#2a1a06;border:0;background:radial-gradient(circle at 35% 30%,#f6dc93,#c49a43 55%,#80601f);box-shadow:0 3px 8px rgba(0,0,0,.55),inset 0 0 0 2px rgba(90,60,15,.6),inset 0 0 0 4px rgba(255,236,180,.35);}
.medal:hover{filter:brightness(1.12);}
.medal:focus-visible{outline:2px solid #fff;}
.medal .ic{width:20px;height:20px;stroke-width:2;}
.legend{position:absolute;left:66px;bottom:10px;background:rgba(14,20,23,.82);border:1px solid rgba(214,173,85,.35);border-radius:8px;padding:6px 10px;font-size:12px;display:flex;gap:10px;flex-wrap:wrap;max-width:calc(100% - 90px);backdrop-filter:blur(2px);}
#monthBanner{position:absolute;left:50%;top:18%;transform:translate(-50%,0);pointer-events:none;text-align:center;opacity:0;}
#monthBanner.on{animation:mBanner 1.9s ease forwards;}
#monthBanner .mb{padding:10px 46px 12px;background:linear-gradient(90deg,transparent,rgba(20,10,5,.85) 18%,rgba(20,10,5,.85) 82%,transparent);border-top:1px solid rgba(214,173,85,.6);border-bottom:1px solid rgba(214,173,85,.6);}
#monthBanner b{display:block;font-family:var(--f-disp);font-weight:400;font-size:40px;color:var(--brass3);line-height:1.1;text-shadow:0 2px 0 #2a1205;}
#monthBanner small{font-size:14px;color:var(--paper);letter-spacing:.2em;}
@keyframes mBanner{0%{opacity:0;transform:translate(-50%,10px)}15%{opacity:1;transform:translate(-50%,0)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-8px)}}

/* 오른쪽 군막 패널 */
#side{width:370px;flex:none;background:linear-gradient(180deg,#152024,#10181b);border-left:2px solid transparent;border-image:var(--gold-edge) 1;overflow:auto;display:flex;flex-direction:column;}
#side > *{flex:none;}
.pane{padding:12px 14px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid rgba(214,173,85,.16);}
.secTitle{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--brass);letter-spacing:.12em;}
.secTitle::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(214,173,85,.45),transparent);}
.secTitle .r{margin-left:auto;letter-spacing:0;color:var(--muted);order:2;}
.cityHead{position:relative;padding:14px 14px 12px;display:flex;flex-direction:column;gap:10px;overflow:hidden;}
.cityHead::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,var(--fc) 0%,transparent 70%);opacity:.38;}
.cityHead > *{position:relative;}
.cityName{display:flex;align-items:center;gap:10px;}
.cityName .banner{width:34px;height:44px;flex:none;display:grid;place-items:center;font-family:var(--f-disp);font-size:18px;color:#fff;background:var(--fc);clip-path:polygon(0 0,100% 0,100% 100%,50% 82%,0 100%);box-shadow:inset 0 0 0 2px rgba(0,0,0,.25);text-shadow:0 1px 2px rgba(0,0,0,.6);padding-bottom:6px;}
.cityName h3{margin:0;font-family:var(--f-disp);font-weight:400;font-size:28px;line-height:1;}
.cityName .han{font-family:var(--f-disp);color:var(--muted);font-size:15px;margin-left:4px;}
.cityName .sub{font-size:12px;color:var(--muted);margin-top:3px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.stars{color:var(--brass3);letter-spacing:1px;font-size:11px;}
.bigStats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.bigStat{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 2px;border-radius:7px;background:rgba(0,0,0,.32);border:1px solid rgba(214,173,85,.18);}
.bigStat .ic{width:18px;height:18px;}
.bigStat b{font-weight:400;font-size:15px;font-variant-numeric:tabular-nums;}
.bigStat span{font-size:10px;color:var(--muted);}
.gauges{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;}
.gauge{display:grid;grid-template-columns:18px auto 1fr;gap:2px 6px;align-items:center;font-size:12px;}
.gauge .ic{width:16px;height:16px;grid-row:span 2;color:var(--muted);}
.gauge span{color:var(--muted);}
.gauge b{font-weight:400;text-align:right;font-variant-numeric:tabular-nums;}
.gauge .bar{grid-column:2 / 4;}
.bar{height:6px;background:#0a1013;border-radius:3px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.6);}
.bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#9a7430,#f0cf7c);}
.bar.jade i{background:linear-gradient(90deg,#2f6e52,#7fd1a9);}
.bar.red i{background:linear-gradient(90deg,#8f2c19,#ef8a6c);}
.bar.sky i{background:linear-gradient(90deg,#355a7a,#9fc8ea);}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 10px;font-size:13px;}
.kv div{display:flex;justify-content:space-between;gap:6px;border-bottom:1px dotted rgba(165,157,136,.25);padding:2px 0;}
.kv span{color:var(--muted);}
.kv b{font-weight:400;font-variant-numeric:tabular-nums;}

/* 명령판 */
.cmdGroups{display:flex;flex-direction:column;gap:8px;}
.cmdRow{display:grid;grid-template-columns:44px repeat(4,1fr);gap:5px;align-items:stretch;}
.cmdRow .lab{display:grid;place-items:center;writing-mode:vertical-rl;font-family:var(--f-disp);font-size:13px;letter-spacing:.2em;color:var(--gc);border-radius:6px;background:rgba(0,0,0,.25);border:1px solid color-mix(in srgb,var(--gc) 40%,transparent);}
.cmdGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;}
.cmd{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:56px;padding:6px 2px 5px;border-radius:7px;cursor:pointer;background:linear-gradient(180deg,#24363c,#162227);border:1px solid #3c5257;box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 2px 0 rgba(0,0,0,.45);font-size:13px;transition:filter .12s,border-color .12s,transform .06s;}
.cmd .ic{width:22px;height:22px;color:var(--gc,var(--brass3));filter:drop-shadow(0 1px 0 rgba(0,0,0,.6));}
.cmd small{font-size:10px;color:var(--muted);line-height:1;}
.cmd:hover{border-color:var(--gc,var(--brass));filter:brightness(1.15);}
.cmd:active{transform:translateY(1px);}
.cmd:focus-visible{outline:2px solid var(--brass3);outline-offset:1px;}
.cmd:disabled{opacity:.35;cursor:default;filter:grayscale(.7);transform:none;}
.g-nae{--gc:#7fd1a9;} .g-mil{--gc:#ef8a6c;} .g-in{--gc:#f0cf7c;} .g-ce{--gc:#b9a0e4;}
.apDots{display:inline-flex;gap:4px;}
.apDots i{width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f6dc93,#b48a35);box-shadow:0 0 0 1px #5a4214;display:inline-block;}
.apDots i.off{background:#26343a;box-shadow:inset 0 1px 2px rgba(0,0,0,.6);}
.hint{font-size:12px;color:var(--muted);line-height:1.55;}

/* 장수 줄 */
.offList{display:flex;flex-direction:column;gap:4px;}
.offRow{display:flex;align-items:center;gap:9px;padding:4px 8px 4px 4px;border-radius:7px;cursor:pointer;border:1px solid transparent;background:rgba(255,255,255,.02);text-align:left;width:100%;}
.offRow:hover{border-color:rgba(214,173,85,.45);background:var(--panel2);}
.offRow img{width:32px;height:38px;border-radius:4px;flex:none;box-shadow:0 0 0 1px var(--brass2);}
.offRow .n{min-width:58px;font-size:16px;}
.offRow .tag{font-size:11px;padding:0 6px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;}
.offRow .tag.g{color:#2a1a06;background:linear-gradient(180deg,#f0cf7c,#c49a43);border-color:transparent;font-weight:700;}
.offRow .s{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;gap:4px;align-items:center;}
.st{display:inline-flex;align-items:baseline;gap:1px;padding:1px 5px;border-radius:4px;background:rgba(0,0,0,.3);}
.st em{font-style:normal;font-size:10px;color:var(--muted);}
.st.hi{color:var(--brass3);} .st.mid{color:var(--paper);} .st.lo{color:#8d8572;}
.offRow.acted{opacity:.45;}
.offRow.acted::after{content:"완료";font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px;}

/* 소식 */
.log{font-size:13px;display:flex;flex-direction:column;gap:4px;max-height:220px;overflow:auto;}
.log div{display:flex;gap:8px;align-items:baseline;}

// 연호 (후한 헌제)
function eraName(y) {
  const eras = [[220, '연강'], [196, '건안'], [194, '흥평'], [190, '초평'], [189, '영한'], [0, '중평']];
  const [start, n] = eras.find(([s]) => y >= s);
  const k = y - start + 1;
  return `${n} ${k === 1 ? '원' : k}년`;
}

  관정: ['', '', '공손찬의 장사. 역경이 함락되자 "군자는 남을 위험에 빠뜨리고 저 혼자 살지 않는다"며 적진에 뛰어들어 죽었다.'],
  공손속: ['', '요서 영지', '공손찬의 아들. 흑산적 장연에게 구원을 청하러 갔으나 역경이 함락된 뒤 죽었다.'],
  전해: ['', '', '공손찬이 임명한 청주자사. 유비와 함께 원소군과 싸웠다.'],
  공손도: ['승제', '요동 양평', '요동태수로 스스로 요동후·평주목이라 일컬으며 고구려와 오환을 쳐 독자 세력을 이루었다.'],
  공손강: ['', '요동 양평', '공손도의 아들. 원상·원희가 도망쳐 오자 목을 베어 조조에게 보냈다.'],
  양의: ['', '', '공손씨를 섬긴 요동의 장수.'],
  유비: ['현덕', '탁군 탁현', '중산정왕의 후예라 일컬은 돗자리 장수 출신. 관우·장비와 의형제를 맺고 오래 떠돌다 제갈량을 얻어 익주를 차지하고 촉한을 세웠다.'],
  관우: ['운장', '하동 해현', '붉은 얼굴에 긴 수염의 미염공. 청룡언월도로 안량을 베고 형주를 지켰으나 여몽에게 형주를 잃고 죽었다. 훗날 관제로 모셔졌다.'],
  장비: ['익덕', '탁군', '장판교에서 홀로 조조의 대군을 호령해 물리친 만인지적. 장팔사모를 썼으며, 술과 성급함 탓에 부하에게 살해되었다.'],
  간옹: ['헌화', '탁군', '유비의 어린 시절 친구로 평생 곁을 지켰다. 익살스럽고 거침없는 말솜씨로 사자 일을 맡았다.'],
  관평: ['', '하동 해현', '관우의 아들(연의에서는 양자). 아버지와 함께 형주를 지키다 맥성에서 사로잡혀 함께 죽었다.'],
  공융: ['문거', '노국', '공자의 20대손. 어려서 큰 배를 형에게 양보한 일화로 이름난 북해상. 조조를 거듭 비꼬다 처형되었다.'],
  무안국: ['', '', '공융의 장수. 연의에서 철퇴를 들고 여포와 싸우다 손목이 잘렸다.'],
  손소: ['장서', '북해', '공융의 부하였다가 손권을 섬겨 오의 첫 승상이 되었다.'],
  태사자: ['자의', '동래 황현', '포위된 공융을 구하러 홀로 적진을 뚫었고, 신정에서 손책과 맞붙은 뒤 손책을 섬긴 신의의 무장.'],
  조조: ['맹덕', '패국 초현', '"치세의 능신, 난세의 간웅". 천자를 맞아들이고 관도에서 원소를 꺾어 북방을 통일했으며, 둔전과 인재 등용으로 위나라의 기틀을 닦았다.'],
  하후돈: ['원양', '패국 초현', '조조의 첫 거병부터 함께한 맹장. 여포군과 싸우다 화살에 눈을 맞았는데, 연의에서는 화살을 뽑아 눈알을 삼켰다고 한다.'],
  하후연: ['묘재', '패국 초현', '"사흘에 오백 리, 엿새에 천 리"를 달린 급습의 명수. 정군산에서 황충에게 베였다.'],
  조인: ['자효', '패국 초현', '조조의 사촌 동생. 강릉에서 주유를 막고 번성에서 관우를 버텨 낸 수성의 명장.'],
  조홍: ['자렴', '패국 초현', '형양에서 패해 말을 잃은 조조에게 "천하에 제가 없어도 되지만 공은 없어서는 안 됩니다"라며 말을 내주어 살렸다.'],
  조비: ['자환', '패국 초현', '조조의 아들. 220년 헌제에게서 선양을 받아 위의 황제(문제)가 되었다. 문학 비평서 「전론」을 남긴 문인이기도 하다.'],
  악진: ['문겸', '양평 위국', '몸집은 작았으나 늘 먼저 성벽에 오른 조조의 선봉장. 합비에서 장료와 함께 손권을 막았다.'],
  이전: ['만성', '산양 거야', '학문을 좋아하고 겸손했던 조조의 장수. 합비에서 사이가 나빴던 장료와도 힘을 모았다.'],
  순욱: ['문약', '영천 영음', '"나의 장자방"이라 불린 조조의 으뜸 참모. 천자를 맞아들이자고 권했으나, 조조가 위공이 되려 하자 반대하다 세상을 떠났다.'],
  순유: ['공달', '영천 영음', '순욱의 조카. 여포·원소와의 싸움에서 기묘한 계책을 거듭 낸 조조의 군사.'],
  곽가: ['봉효', '영천 양적', '원소를 이길 열 가지 이유를 말한 조조의 천재 책사. 오환 원정 뒤 38세로 요절했고, 조조는 적벽에서 패한 뒤 그를 그리워했다.'],
  만총: ['백녕', '산양 창읍', '법을 엄하게 집행한 관리이자, 합비 신성을 쌓아 오의 공격을 막은 위의 중신.'],
  정욱: ['중덕', '동군 동아', '여포가 연주를 휩쓸 때 세 성을 지켜 조조의 근거지를 살렸다. 연의에서는 서서의 어머니를 이용해 서서를 데려오게 했다.'],
  우금: ['문칙', '태산 거평', '엄격한 군율로 이름난 조조의 명장이었으나, 번성에서 관우의 수공에 갇혀 항복하는 바람에 이름을 잃었다.'],
  진궁: ['공대', '동군', '조조를 섬기다 등지고 여포의 모사가 되었다. 하비에서 사로잡히자 조조의 회유를 물리치고 죽음을 택했다.'],
  전위: ['', '진류 기오', '쌍극을 쓰던 괴력의 호위장. 완성에서 장수의 기습을 받자 문을 막고 홀로 싸워 조조를 살리고 죽었다.'],
  허저: ['중강', '초국 초현', '"호치(미친 호랑이)"라 불린 조조의 호위장. 연의에서 마초와 웃통을 벗고 싸운 일기토로 유명하다.'],
  서황: ['공명', '하동 양현', '양봉을 떠나 조조를 섬겼다. 번성에서 관우의 포위를 풀어 "주아부의 풍모가 있다"는 칭찬을 받았다.'],
  양봉: ['', '', '이각의 장수였다가 헌제를 낙양으로 호위했다. 뒤에 원술·여포와 손잡고 떠돌다 유비에게 죽었다.'],
  사마의: ['중달', '하내 온현', '제갈량의 북벌을 막아 낸 위의 지략가. 고평릉 사변으로 조씨의 권력을 빼앗아 손자 사마염이 세울 진나라의 기틀을 닦았다.'],
  장연: ['', '상산 진정', '흑산적의 두목. 백만이라 불린 무리를 이끌고 원소와 다투다 조조에게 항복했다.'],
  도겸: ['공조', '단양', '서주목. 조조의 아버지 조숭이 서주에서 죽어 조조의 침공을 받았고, 죽기 전 유비에게 서주를 맡겼다.'],
  미축: ['자중', '동해 구현', '거부 상인 출신. 서주에서 유비를 따르며 재산과 누이를 바쳤고, 끝까지 유비를 섬겼다.'],
  미방: ['자방', '동해 구현', '미축의 동생. 남군을 지키다 관우와 사이가 틀어져 오에 항복했고, 이 일로 관우가 몰락했다.'],
  손건: ['공우', '북해', '유비의 오랜 사자. 원소와 유표에게 오가며 유비가 몸을 의탁할 곳을 마련했다.'],
  진등: ['원룡', '하비 회포', '진규의 아들. 조조와 손잡고 여포를 무너뜨렸고, 광릉태수로 손책의 북상을 막았다.'],
  진규: ['한유', '하비 회포', '진등의 아버지. 여포와 원술의 혼인 동맹을 깨뜨리는 계책을 냈다.'],
  조표: ['', '', '도겸의 부하. 연의에서는 장비에게 매를 맞은 앙갚음으로 여포를 끌어들여 하비를 빼앗기게 했다.'],
  장패: ['선고', '태산 화현', '태산의 호족으로 여포와 손잡았다가 조조에게 귀순해 청주·서주의 동쪽을 맡았다.'],
  원술: ['공로', '여남 여양', '원소의 사촌 동생. 옥새를 손에 넣자 수춘에서 황제를 칭했으나 천하의 미움을 받고 몰락해, 꿀물 한 그릇을 찾다 죽었다.'],
  기령: ['', '', '원술의 대장. 소패에서 유비를 치려 할 때 여포가 화살 한 발로 화극을 맞혀 싸움을 말렸다(원문사극).'],
  장훈: ['', '', '원술의 대장군. 손책과 친분이 있었으며, 원술이 몰락한 뒤 조조에게 항복했다.'],
  교유: ['', '', '원술의 장수. 진국을 치다 조조에게 패해 죽었다.'],
  염상: ['', '', '원술의 주부. 원술이 황제를 칭하려 하자 주 문왕이 천하의 3분의 2를 가지고도 은을 섬긴 예를 들어 말렸다.'],
  뇌박: ['', '', '원술의 장수. 원술이 몰락하자 진란과 함께 원술을 버리고 산으로 들어갔다.'],
  진란: ['', '', '원술의 장수. 뇌박과 함께 원술을 떠났다가 뒤에 장료에게 토벌되었다.'],
  유표: ['경승', '산양 고평', '팔준으로 이름난 선비. 홀몸으로 형주에 들어가 평정하고 학문을 일으켰으나 천하를 다툴 뜻은 없었다.'],
  괴량: ['자유', '남군 중려', '괴월의 형. 형주를 힘이 아닌 덕으로 다스리라는 방책을 유표에게 냈다.'],
  괴월: ['이도', '남군 중려', '유표에게 계책을 내어 형주의 도적과 호족을 휘어잡게 했고, 유종에게 조조에게 항복하라고 권했다.'],
  채모: ['덕규', '양양', '유표의 처남. 유표가 죽은 뒤 유종을 세우고 조조에게 항복했다. 연의에서는 주유의 계책에 걸려 조조에게 죽었다.'],
  황조: ['', '', '강하태수. 현산에서 손견을 죽인 원수로, 손권에게 오래 공격받다 끝내 죽었다.'],
  문빙: ['중업', '남양 완현', '유표의 대장. 조조에게 귀순한 뒤 강하를 수십 년 지켜 오의 북상을 막았다.'],
  장윤: ['', '', '유표의 수군 장수. 연의에서 채모와 함께 조조의 수군을 맡았다가 주유의 이간계로 처형되었다.'],
  황충: ['한승', '남양', '노익장의 대명사. 정군산에서 하후연을 베어 오호대장군이 되었다.'],
  이적: ['기백', '산양', '유표를 섬기다 유비를 따른 사자. 오에 가서 재치 있는 응대로 손권을 감탄시켰다.'],
  위연: ['문장', '의양', '유비가 한중태수로 발탁한 맹장. 자오곡 기습 계책을 냈으나 제갈량 사후 양의와 다투다 반역자로 몰려 죽었다.'],
  마량: ['계상', '양양 의성', '눈썹에 흰 털이 있어 "마씨 다섯 형제 중 백미(白眉)가 가장 낫다"는 말의 주인공. 이릉 전투에서 전사했다.'],
  마속: ['유상', '양양 의성', '마량의 동생. 제갈량이 아꼈으나 가정에서 명을 어기고 산 위에 진을 쳤다가 패해, 눈물을 흘리는 제갈량에게 베어졌다(읍참마속).'],
  방통: ['사원', '양양', '봉추라 불린 천재. 유비의 익주 공략을 이끌다 낙봉파에서 화살에 맞아 36세로 죽었다.'],
  제갈량: ['공명', '낭야 양도', '와룡. 삼고초려 끝에 유비를 섬겨 천하삼분지계를 내놓았고, 승상으로 촉을 다스리며 여러 차례 북벌에 나섰다가 오장원에서 죽었다.'],
  서서: ['원직', '영천', '단복이라는 이름으로 유비를 도왔으나 어머니 때문에 조조에게 가면서 제갈량을 천거했다.'],
  등애: ['사재', '의양 극양', '말을 더듬던 둔전 관리 출신. 음평의 험한 길을 넘어 성도를 함락해 촉을 멸망시켰다.'],
  강유: ['백약', '천수 기현', '제갈량에게 발탁된 위 출신의 젊은 장수. 스승의 뜻을 이어 북벌에 거듭 나섰다.'],
  손견: ['문대', '오군 부춘', '손자의 후예라 일컬은 "강동의 호랑이". 반동탁 연합에서 가장 용맹했고 낙양에서 옥새를 얻었으나, 현산에서 황조의 매복에 쓰러졌다.'],
  정보: ['덕모', '우북평 토은', '손견·손책·손권 3대를 섬긴 원로 장수. 적벽에서 주유와 함께 도독을 맡았다.'],
  황개: ['공복', '영릉 천릉', '손씨 3대를 섬긴 노장. 적벽에서 거짓 항복과 화공을 제안해 조조의 대함대를 불태웠다.'],
  한당: ['의공', '요서 영지', '활과 말에 능해 손견 때부터 손씨를 섬긴 장수.'],

  o.items = o.items || []; if (!o.items.includes(id)) o.items.push(id);
  for (const k in it.bonus || {}) o[k] = Math.min(100, o[k] + it.bonus[k]);

function applyScenario(g, sc) {
  g.year = sc.year; g.month = sc.month; g.scen = sc.year;
  const byN = n => g.officers.find(o => o.name === n);
  // 세력
  g.factions = sc.factions.map(([key, rn, color], i) => ({ id: i, key, name: rn, color, ruler: -1, alive: true, capital: -1, rn }));
  const fk = Object.fromEntries(g.factions.map(f => [f.key, f.id]));
  // 성
  for (const c of g.cities) { c.f = -1; c.troops = 0; c.gov = -1; }
  const grow = 1 + (sc.year - 190) * .05;
  sc.factions.forEach(([key, rn, color, cs, os, mul], i) => {
    for (const n of cs.split(' ')) {
      const c = g.cities[CITY_BY_NAME[n]]; c.f = i;
      c.troops = Math.round((2500 + c.size * 1900) * (mul || 1) * (1 + (sc.year - 190) * .03) / 100) * 100;
      c.train = ri(55, 75); c.order = ri(55, 80); c.gold = 400 + c.size * 160; c.food = 6000 + c.size * 3000;
    }
  });
  for (const c of g.cities) { c.agri = Math.min(c.agriMax, Math.round(c.agri * grow)); c.comm = Math.min(c.commMax, Math.round(c.comm * grow)); if (c.f < 0) c.troops = 0; }
  // 인물
  const dead = new Set((sc.dead || '').split(' ').filter(Boolean));
  const listed = {};
  sc.factions.forEach(([key, rn, color, cs, os], i) => { const first = CITY_BY_NAME[cs.split(' ')[0]]; os.split(' ').forEach(n => listed[n] = [i, first]); });
  const ron = Object.fromEntries((sc.ronin || '').split(' ').filter(Boolean).map(s => { const [n, c] = s.split('@'); return [n, CITY_BY_NAME[c]]; }));
  for (const o of g.officers) {
    o.f = -1; o.found = false;
    if (dead.has(o.name)) { o.st = 'dead'; continue; }
    if (sc.year - o.born < 16) { o.st = 'unborn'; continue; }
    if (listed[o.name]) {
      const [fi, c0] = listed[o.name];
      o.st = 'on'; o.f = fi;
      if (g.cities[o.city]?.f !== fi) o.city = c0;
    } else if (o.hdie < sc.year && !ron[o.name]) { o.st = 'dead'; continue; }
    else { o.st = 'ronin'; if (ron[o.name] != null) o.city = ron[o.name]; }
    if (o.die <= sc.year) o.die = sc.year + 1 + ri(0, 2);
  }
  // 군주와 각 성 배치: 장수는 그 세력의 성에 고루
  g.factions.forEach(f => {
    const r = byN(f.rn); r.st = 'on'; r.f = f.id;
    const cs = g.cities.filter(c => c.f === f.id);
    f.ruler = r.id; if (g.cities[r.city].f !== f.id) r.city = cs[0].id; f.capital = r.city;
    const offs = g.officers.filter(o => o.st === 'on' && o.f === f.id && o !== r);
    offs.forEach((o, k) => { if (g.cities[o.city].f !== f.id || (cs.length > 1 && k % 2)) o.city = cs[(k + 1) % cs.length].id; });
  });
  // 사건·동맹·숙원
  g.ev = {}; for (const id of (sc.done || '').split(' ').filter(Boolean)) g.ev[id] = true;
  g.start = (sc.year - START_YEAR) * 12 + sc.month;
  return { fk };
}
function applyScenarioAfter(g, sc, fk) {
  for (const [a, b, m] of sc.ally || []) if (fk[a] != null && fk[b] != null) g.ally[relKey(fk[a], fk[b])] = g.start + m;
  for (const [a, b, m] of sc.focus || []) if (fk[a] != null && fk[b] != null) g.focus.push({ f: fk[a], t: fk[b], until: g.start + m });
  for (const id in sc.items || {}) {
    const st = g.items[id]; if (!st) continue;
    if (st.holder >= 0) takeItemRaw(g, id);
    const n = sc.items[id];
    const o = n ? g.officers.find(x => x.name === n) : null;
    if (o && o.st !== 'dead') giveItemRaw(g, id, o); else { st.city = CITY_BY_NAME['허창']; st.found = false; }
  }
  // 죽은 주인의 보물은 그 고향에 숨음
  for (const it of ITEMS) { const st = g.items[it.id]; if (st.holder >= 0 && g.officers[st.holder].st === 'dead') { const o = g.officers[st.holder]; takeItemRaw(g, it.id); st.city = o.home; st.found = false; } }
}

// ===== 규칙: 내정·인사·외교 (플레이어와 AI가 함께 씀) =====
const COST = { agri: 50, comm: 50, order: 20, wall: 80, train: 0, search: 0 };
const DEV_NAME = { agri: '개간', comm: '상업', order: '치안', wall: '성벽' };

function devMul(o, kind) { let m = hasSkill(o, '치정') ? 1.3 : 1; if (kind === 'agri' && hasSkill(o, '둔전')) m *= 1.5; if (kind === 'comm' && hasSkill(o, '상재')) m *= 1.5; if (kind === 'wall' && hasSkill(o, '축성')) m *= 1.5; return m; }
function cmdDevelop(o, c, kind) {
  if (c.gold < COST[kind]) return { ok: false, msg: '금이 모자랍니다' };
  let gain = 0, msg = '';
  if (kind === 'agri' || kind === 'comm') {
    const max = kind === 'agri' ? c.agriMax : c.commMax;
    if (c[kind] >= max) return { ok: false, msg: '이미 최대치입니다' };

    if (c.order >= 100) return { ok: false, msg: '치안이 이미 최고입니다' };

    gain = Math.round((o.pol / 5 + o.lead / 10 + ri(4, 14)) * devMul(o, kind));

function cmdDraft(o, c, n) {

function cmdHire(o, c, target) {

  const p = hireChance(o, target, c.f);
  if (chance(p)) {
    const wasEnemy = target.st === 'on';
    if (wasEnemy) logMsg(`${iga(target.name)} ${facName(target.f)}군을 떠나 ${facName(c.f)}군에 들어갔습니다`);
    joinFaction(target, c.f, c.id);
    o.merit += 40;
    return { ok: true, msg: `${eun(target.name)} 기꺼이 따르겠다고 합니다!`, joined: true };
  }
  o.merit += 5;
  if (target.st === 'on') target.loy = Math.max(0, target.loy - ri(1, 4)); // 흔들림
  return { ok: true, msg: `${eun(target.name)} 거절했습니다`, joined: false };
}
function joinFaction(t, f, cid) {
  if (t.st === 'on' && t.f >= 0) {
    const oc = G.cities[t.city]; if (oc.gov === t.id) oc.gov = -1;
  }
  t.st = 'on'; t.f = f; t.city = cid; t.found = true; t.acted = true; delete t.travel;
  const ruler = G.officers[G.factions[f].ruler];
  t.loy = (t.tag && t.tag === ruler.tag) ? 100 : clamp(78 - affDist(t, ruler) / 2 + ri(0, 12), 55, 96);
  t.merit = Math.max(t.merit, 100);
}
function cmdReward(giver, c, t) {
  if (c.gold < 100) return { ok: false, msg: '금이 모자랍니다 (100 필요)' };
  if (t.loy >= 100) return { ok: false, msg: '이미 충성이 지극합니다' };
  c.gold -= 100; const g = ri(5, 10); t.loy = Math.min(100, t.loy + g);
  return { ok: true, msg: `${t.name} 충성 +${g}` };
}
// ===== 먼 길: 길을 따라 한 칸에 한 달 (바로 옆 성은 그달에 도착) =====
// f가 있으면 그 세력의 성만 지나감, 없으면(재야) 어디든
function routesFrom(cid, f) {
  const prev = { [cid]: -1 }, q = [cid], out = [];
  while (q.length) {
    const a = q.shift();
    for (const b of ADJ[a]) {
      if (prev[b] !== undefined) continue;
      if (f != null && G.cities[b].f !== f) continue;
      prev[b] = a; q.push(b);
      const path = [b]; for (let k = a; k !== -1; k = prev[k]) path.unshift(k);
      out.push({ c: G.cities[b], path, months: path.length - 2 });
    }
  }
  return out;
}
function routeTo(from, to, f) { return routesFrom(from, f).find(r => r.c.id === to) || null; }
function nearestOwn(cid, f) {
  if (G.cities[cid].f === f) return cid;
  const r = routesFrom(cid, null).find(r => r.c.f === f); return r ? r.c.id : -1;
}
function travelLeft(o) { return o.travel ? Math.max(0, o.travel.eta - mIdx()) : 0; }
// 지도에 그릴 현재 위치(길 위 비율)
function travelPos(t) {
  const tot = Math.max(1, t.eta - t.start), done = clamp((mIdx() - t.start + .5) / (tot + 1), 0, 1);
  const segs = t.path.length - 1, u = done * segs, i = Math.min(segs - 1, Math.floor(u)), fr = u - i;
  const A = G.cities[t.path[i]], B = G.cities[t.path[i + 1]];
  return { x: A.x + (B.x - A.x) * fr, y: A.y + (B.y - A.y) * fr };
}
function cmdMove(o, to, path) {
  const from = G.cities[o.city]; if (from.gov === o.id) from.gov = -1;
  const months = path ? path.length - 2 : 0;
  if (months <= 0) { o.city = to; delete o.travel; }
  else o.travel = { to, path, start: mIdx(), eta: mIdx() + months };
  o.acted = true;
  return months;
}
function cmdTransport(o, from, to, gold, food, troops, path) {
  const months = path ? path.length - 2 : 0;
  if (months > 0) {
    gold = clamp(Math.floor(gold), 0, from.gold); food = clamp(Math.floor(food), 0, from.food); troops = clamp(Math.floor(troops / 100) * 100, 0, from.troops);
    from.gold -= gold; from.food -= food; from.troops -= troops;
    (G.convoys = G.convoys || []).push({ f: from.f, from: from.id, to: to.id, gold, food, troops, train: from.train, path, start: mIdx(), eta: mIdx() + months, oid: o.id });
    o.acted = true; o.merit += 6 + months * 3;
    return { ok: true, msg: `${ro(to.name)} 금 ${fmt(gold)}·쌀 ${fmt(food)}·병사 ${fmt(troops)}을 보냈습니다. ${months}달 뒤 도착합니다` };
  }
  gold = clamp(Math.floor(gold), 0, from.gold); food = clamp(Math.floor(food), 0, from.food); troops = clamp(Math.floor(troops / 100) * 100, 0, Math.min(from.troops, Math.max(0, troopMax(to) - to.troops)));
  from.gold -= gold; to.gold += gold; from.food -= food; to.food += food;
  if (troops > 0) { to.train = Math.round((to.train * to.troops + from.train * troops) / (to.troops + troops)); from.troops -= troops; to.troops += troops; }
  o.acted = true; o.merit += 6;
  return { ok: true, msg: `${to.name}에 금 ${fmt(gold)}·쌀 ${fmt(food)}·병사 ${fmt(troops)} 보냄` };
}

// 외교
function dipGift(env, fromF, toF, gold) {
  const c = G.cities.find(x => x.f === fromF && x.id === env.city);
  if (!c || c.gold < gold) return { ok: false, msg: '금이 모자랍니다' };
  c.gold -= gold; const d = Math.round(gold / 25 + env.cha / 15 + ri(0, 4));
  addRel(fromF, toF, d); env.acted = true; env.merit += 15;
  return { ok: true, msg: `${facName(toF)}와의 우호 +${d} (지금 ${getRel(fromF, toF)})` };
}
function allyChance(env, fromF, toF) {
  const r = getRel(fromF, toF);
  if (r < 55) return 0;
  const powA = factionPower(fromF), powB = factionPower(toF);
  let p = (r - 50) / 50 * (.45 + env.cha / 200);
  if (powA < powB * .4) p *= .6; // 너무 약하면 얕봄
  return clamp(p, 0, .9);
}
function dipAlly(env, fromF, toF) {
  env.acted = true;
  if (chance(allyChance(env, fromF, toF))) { makeAlly(fromF, toF); addRel(fromF, toF, 10); env.merit += 60; logMsg(`${facName(fromF)}군과 ${facName(toF)}군이 동맹을 맺었습니다`, 'dip'); return { ok: true, msg: `${facName(toF)}군과 동맹을 맺었습니다!` }; }
  addRel(fromF, toF, -3);
  return { ok: true, msg: `${facName(toF)}군이 동맹을 거절했습니다` };
}
function breakAlly(a, b) { delete G.ally[relKey(a, b)]; addRel(a, b, -40); logMsg(`${facName(a)}군이 ${facName(b)}군과의 동맹을 끊었습니다`, 'dip'); }
function plotChance(env, t) {
  if (t.st !== 'on' || isRuler(t)) return 0;
  const tr = G.officers[G.factions[t.f].ruler];
  if (t.tag && t.tag === tr.tag) return 0;
  return clamp(.3 + (env.int - t.int) / 90, .05, .85);
}
function plotSow(env, t) {
  env.acted = true;
  if (chance(plotChance(env, t))) { const d = ri(6, 14); t.loy = Math.max(0, t.loy - d); env.merit += 25; return { ok: true, msg: `이간 성공 — ${t.name} 충성 −${d} (지금 ${t.loy})` }; }
  return { ok: true, msg: '이간이 들통나 실패했습니다' };
}

function factionPower(f) {
  let p = 0;
  for (const c of G.cities) if (c.f === f) p += c.troops * (.6 + c.train / 250);
  return p;
}
function factionOfficers(f) { return G.officers.filter(o => o.st === 'on' && o.f === f); }

// ===== 죽음·계승·멸망 =====
function killOfficer(o, why) {
  const wasRuler = isRuler(o);
  dropItems(o);
  const c = G.cities[o.city];
  if (c && c.gov === o.id) c.gov = -1;
  const f = o.f;
  o.st = 'dead'; o.f = -1;
  if (why) logMsg(why, 'death');
  if (wasRuler && f >= 0) succession(f, o);
  if (o.id === G.player) onPlayerDeath(o, f, wasRuler);
}
function succession(f, old) {
  const F = G.factions[f];
  const cands = factionOfficers(f);
  if (!cands.length) { destroyFaction(f, `${F.name}군은 이어받을 사람이 없어 무너졌습니다`); return null; }
  cands.sort((a, b) => ((b.tag && b.tag === old.tag) - (a.tag && a.tag === old.tag)) * 1000 + (b.merit / 10 + b.cha + b.lead) - (a.merit / 10 + a.cha + a.lead));
  const heir = HIST() && HEIRS[old.name] ? cands.find(o => o.name === HEIRS[old.name]) : null;
  const n = heir || cands[0];
  F.ruler = n.id; n.loy = 100; F.name = n.name; F.capital = n.city;
  logMsg(`${iga(n.name)} ${old.name}의 뒤를 이어 군주가 되었습니다`, 'big');
  // 충성이 낮은 장수는 흩어지기도
  for (const o of cands) if (o !== n && o.loy < 50 && chance(.4) && o.id !== G.player) { leaveToRonin(o); }
  assignGovs();
  return n;
}
function leaveToRonin(o) {
  const c = G.cities[o.city]; if (c.gov === o.id) c.gov = -1;
  o.st = 'ronin'; o.f = -1; o.found = true; o.loy = 0;
}
function destroyFaction(f, why) {
  const F = G.factions[f]; if (!F.alive) return;
  F.alive = false;
  for (const c of G.cities) if (c.f === f) { c.f = -1; c.gov = -1; c.deleg = false; }
  for (const o of G.officers) if (o.st === 'on' && o.f === f) { o.st = 'ronin'; o.f = -1; o.found = true; }
  for (const k in G.ally) if (k.split(',').map(Number).includes(f)) delete G.ally[k];
  logMsg(why || `${F.name}군이 멸망했습니다`, 'big');
}
function checkFactions() {
  for (const F of G.factions) {
    if (!F.alive) continue;
    if (!G.cities.some(c => c.f === F.id)) {
      const r = G.officers[F.ruler];
      destroyFaction(F.id, `${F.name}군이 마지막 성을 잃고 멸망했습니다`);
      if (r && r.st === 'ronin' && r.id === G.player) UI.queue({ title: '세력 멸망', text: '모든 성을 잃었습니다. 이제 재야의 몸으로 다시 일어서야 합니다.' });
    }
  }
}

// 달이 바뀔 때: 길 위의 장수와 수송대 도착
function monthlyTravel() {
  const now = mIdx(), P = me();
  for (const o of G.officers) {
    if (!o.travel || o.st === 'dead') { if (o.travel && o.st === 'dead') delete o.travel; continue; }
    if (now < o.travel.eta) continue;
    let to = o.travel.to;
    if (o.st === 'on' && G.cities[to].f !== o.f) {
      const alt = nearestOwn(to, o.f);
      if (o.id === G.player || (P && o.f === P.f)) logMsg(`${G.cities[to].name}이(가) 다른 세력의 손에 넘어가 ${o.name}은(는) ${alt >= 0 ? G.cities[alt].name + '(으)로 향했습니다' : '갈 곳을 잃었습니다'}`);
      if (alt >= 0) to = alt;
    }
    o.city = to; delete o.travel;
    if (o.st === 'ronin' && o.id === G.player) for (const x of roninIn(to)) x.found = x.found || chance(.5);
    if (o.id === G.player) logMsg(`${G.cities[to].name}에 도착했습니다`, 'big');
  }
  const keep = [];
  for (const v of G.convoys || []) {
    if (now < v.eta) { keep.push(v); continue; }
    let to = G.cities[v.to];
    if (to.f !== v.f) { const alt = nearestOwn(v.to, v.f); to = alt >= 0 ? G.cities[alt] : null; }
    const mine = P && P.st === 'on' && P.f === v.f;
    if (!to) { if (mine) logMsg(`${G.cities[v.to].name}(으)로 가던 수송대가 갈 곳을 잃고 흩어졌습니다`); continue; }
    to.gold += v.gold; to.food += v.food;
    const room = Math.max(0, troopMax(to) - to.troops), t = Math.min(v.troops, room);
    if (t > 0) { to.train = Math.round((to.train * to.troops + v.train * t) / (to.troops + t)); to.troops += t; }
    if (mine) logMsg(`수송대가 ${to.name}에 도착했습니다 (금 ${fmt(v.gold)}·쌀 ${fmt(v.food)}·병사 ${fmt(t)}${v.troops > t ? ` · 병력 한도로 ${fmt(v.troops - t)}명 흩어짐` : ''})`);
  }
  G.convoys = keep;
}

// ---- 05-war.js
// ===== 전쟁: 출진·점령·포로 =====
function autoType(o) { return o.war >= 82 && o.lead >= 70 ? 'cav' : (o.int > o.war + 8 ? (o.lead >= 74 ? 'xbow' : 'arc') : 'inf'); }
// 원군: 수비 세력의 이웃 성이나 동맹이 장수 한 명씩 보냄 (최대 둘)
function gatherReinforce(B, to) {
  if (B.naval || B.defF < 0) return [];
  const list = [];
  for (const i of shuffle([...ADJ[to.id]])) {
    if (list.length >= 2) break;
    const c = G.cities[i];
    if (c.f < 0 || c.id === B.fromId || c.f === B.attF) continue;
    const own = c.f === B.defF, al = !own && isAlly(c.f, B.defF);
    if ((!own && !al) || c.troops < 6000 || !chance(own ? .55 : .4)) continue;
    const o = officersIn(c.id, c.f).filter(x => !x.acted && x.id !== G.player && c.gov !== x.id && !isRuler(x)).sort((a, b) => (b.lead + b.war) - (a.lead + a.war))[0];
    if (!o) continue;
    const t = Math.min(troopCap(o), 5000, Math.floor(c.troops * .3 / 100) * 100);
    if (t < 1000) continue;
    c.troops -= t; o.acted = true;
    list.push({ oid: o.id, troops: t, type: autoType(o) === 'cav' ? 'cav' : 'inf', fac: c.f, home: c.id, train: c.train });
  }
  if (list.length) addReinforce(B, list, 1);
  return list;
}
// 원군은 싸움이 끝나면 제 성으로 돌아감
function returnAllies(B) {
  for (const u of B.units) {
    if (!u.ally || u.home == null) continue;
    const back = G.cities[u.home], o = bOff(u);
    const fl = B.fled[1].findIndex(f => f.oid === u.oid);
    let t = u.alive ? u.troops : 0;
    if (fl >= 0) { t += B.fled[1][fl].troops; B.fled[1].splice(fl, 1); }
    if (back.f === u.fac) back.troops = Math.min(troopMax(back), back.troops + t);
    if (u.alive) { u.alive = false; if (o.st === 'on') { o.merit += 80; if (B.result && B.result.win === 1) o.fame += 2; } }
  }
}
function troopCap(o) { return 1500 + o.lead * 90; }
// 부대 나누기: 통솔에 비례, 상한 있음
function splitTroops(offs, total) {
  const w = offs.map(o => o.lead + 20), sw = w.reduce((a, b) => a + b, 0);
  let out = offs.map((o, i) => Math.min(troopCap(o), Math.floor(total * w[i] / sw / 100) * 100));
  return out;
}
function defendArmy(c) {
  let offs = officersIn(c.id, c.f);
  offs.sort((a, b) => (b.id === c.gov) - (a.id === c.gov) || (b.lead + b.war) - (a.lead + a.war));
  if (offs[0] && c.gov >= 0 && offs[0].id !== c.gov) { const g = offs.find(o => o.id === c.gov); if (g) offs = [g, ...offs.filter(o => o !== g)]; }
  offs = offs.slice(0, 5);
  const tr = splitTroops(offs, c.troops);
  return offs.map((o, i) => ({ oid: o.id, troops: Math.max(tr[i], 200), type: autoType(o), train: c.train })).filter(u => u.troops > 0);
}

// 출진. 빈 성이면 바로 점령, 아니면 전투를 돌려줌
function launchAttack(from, to, army, food, extra = {}) {
  const attF = from.f;
  const total = army.reduce((a, u) => a + u.troops, 0);
  // 여러 성에서 함께 출진: 부대마다 제 성(src)에서 병사를 뺌
  for (const u of army) { if (u.src == null) u.src = from.id; const s = G.cities[u.src]; s.troops -= u.troops; u.train = s.train; const o = G.officers[u.oid]; o.acted = true; if (s.gov === o.id) s.gov = -1; }
  // 군량은 성마다 보낸 병사 비율대로 (출발 성이 모자라면 남은 성들이 메움)
  let need = food;
  const bySrc = {}; for (const u of army) bySrc[u.src] = (bySrc[u.src] || 0) + u.troops;
  for (const id in bySrc) { const s = G.cities[id], take = Math.min(s.food, Math.round(food * bySrc[id] / Math.max(1, total))); s.food -= take; need -= take; }
  for (const id in bySrc) { if (need <= 0) break; const s = G.cities[id], take = Math.min(s.food, need); s.food -= take; need -= take; }
  food -= Math.max(0, need);
  const defOffs = to.f >= 0 ? officersIn(to.id, to.f) : [];
  if (to.f < 0 || !defOffs.length) {
    // 무혈 입성
    const prevF = to.f;
    const gained = to.f >= 0 ? Math.round(to.troops * .3) : 0;
    occupy(to, attF, army.map(u => u.oid), total + gained, from.train, food);
    if (prevF >= 0) logMsg(`${facName(attF)}군이 장수 없는 ${eul(to.name)} 손쉽게 차지했습니다`, 'war');
    else logMsg(`${facName(attF)}군이 빈 땅 ${eul(to.name)} 차지했습니다`, 'war');
    G.officers[army[0].oid].merit += 80;
    checkFactions();
    return null;
  }
  const B = makeBattle({ attF, defF: to.f, cityId: to.id, fromId: from.id, att: army, def: defendArmy(to), attFood: food, ...extra });
  return B;
}
// 공격 부대가 떠나온 성 (그 사이 잃었으면 null)
function homeOf(B, oid, f) { const u = B.units.find(x => x.oid === oid && x.side === 0); const h = G.cities[u && u.src != null ? u.src : B.fromId]; return h && h.f === f ? h : null; }
// 목표 성에 붙어 있는 우리 성들 (출발 성 먼저)
function attackSources(from, to) { return [from, ...ADJ[to.id].map(i => G.cities[i]).filter(x => x.f === from.f && x !== from)]; }
function occupy(c, f, oids, troops, train, food) {
  c.f = f; c.troops = Math.min(troops, troopMax(c)); c.train = train; c.food += food; c.deleg = false;
  c.order = Math.max(20, c.order - 10);
  for (const id of oids) { const o = G.officers[id]; if (o.st === 'on') o.city = c.id; }
  c.gov = -1;
  // 지휘관 또는 공적 높은 이가 태수
  const cands = oids.map(id => G.officers[id]).filter(o => o.st === 'on' && o.city === c.id && !o.travel);
  if (cands.length) c.gov = cands[0].id;
  assignGovs();
}

// 전투 결과를 세상에 적용 (포로 처리는 따로)
function applyBattle(B) {
  const att = B.attF, def = B.defF, c = G.cities[B.cityId], from = G.cities[B.fromId];
  const win = B.result.win;
  const alive = s => B.units.filter(u => u.alive && u.side === s);
  const capturedSet = new Set(B.captives);
  G.stats.battles++;
  // 죽은 장수
  for (const id of B.killed) { const o = G.officers[id]; if (o.st === 'on') killOfficer(o, `${eun(o.name)} 전장에서 목숨을 잃었습니다`); }
  const attAlive = alive(0), defAlive = alive(1);
  const attCmd = B.units.find(u => u.side === 0 && u.cmd);
  if (win === 0) {
    const winners = attAlive.map(u => u.oid).filter(id => G.officers[id].st === 'on');
    let tr = attAlive.reduce((a, u) => a + u.troops, 0);
    // 수비 생존자는 이웃 성으로 물러남
    const retreat = ADJ[c.id].map(i => G.cities[i]).filter(x => x.f === def).sort((a, b) => b.troops - a.troops)[0];
    const defLeft = [...defAlive.map(u => ({ oid: u.oid, troops: u.troops })), ...B.fled[1]];
    // 싸우지 않은 성 안의 장수들
    for (const o of officersIn(c.id, def)) if (!B.units.some(u => u.oid === o.id)) defLeft.push({ oid: o.id, troops: 0 });
    for (const d of defLeft) {
      const o = G.officers[d.oid]; if (o.st !== 'on' || capturedSet.has(o.id)) continue;
      if (retreat && chance(.85)) { o.city = retreat.id; retreat.troops += Math.round(d.troops * .7); }
      else { B.captives.push(o.id); capturedSet.add(o.id); }
    }
    c.gold = Math.round(c.gold * .5);
    c.food = Math.round(B.food[1] * .5);
    c.wall = Math.max(60, Math.round(c.wall * .8));
    occupy(c, att, attCmd && attCmd.alive ? [attCmd.oid, ...winners.filter(x => x !== attCmd.oid)] : winners, tr, B.units[0].train, B.food[0]);
    for (const f of B.fled[0]) { const o = G.officers[f.oid]; if (o.st !== 'on') continue; const h = homeOf(B, f.oid, att); if (h) { o.city = h.id; h.troops += f.troops; } else o.city = c.id; }
    logMsg(`${facName(att)}군이 ${eul(c.name)} 함락했습니다 (${B.result.why})`, 'war');
    for (const u of attAlive) { const o = G.officers[u.oid]; o.merit += 120; o.fame += 4; }
    if (attCmd) { const o = G.officers[attCmd.oid]; o.fame += 6; }
  } else {
    // 공격 실패 → 돌아감
    const back = from.f === att ? from : (G.cities.find(x => x.f === att && ADJ[x.id].includes(c.id)) || G.cities.find(x => x.f === att));
    const retList = [...attAlive.map(u => ({ oid: u.oid, troops: u.troops })), ...B.fled[0]];
    for (const r of retList) {
      const o = G.officers[r.oid]; if (o.st !== 'on' || capturedSet.has(o.id)) continue;
      const h = homeOf(B, r.oid, att) || back; // 각자 떠나온 성으로
      if (h) { o.city = h.id; h.troops += r.troops; } else { B.captives.push(o.id); }
    }
    if (back) back.food += B.food[0];
    c.troops = defAlive.reduce((a, u) => a + u.troops, 0) + B.fled[1].reduce((a, f) => a + f.troops, 0);
    c.food = B.food[1];
    c.wall = Math.max(60, c.wall - ri(10, 40));
    for (const f of B.fled[1]) { const o = G.officers[f.oid]; if (o.st === 'on') o.city = c.id; }
    logMsg(`${facName(def)}군이 ${eul(c.name)} 지켜 냈습니다 (${B.result.why})`, 'war');
    for (const u of defAlive) { const o = G.officers[u.oid]; o.merit += 100; o.fame += 3; }
  }
  if (win === (B.playerSide ?? -1)) G.stats.wins++;
  // 전쟁은 우호를 깎음
  if (att >= 0 && def >= 0) addRel(att, def, -15);
  assignGovs();
}

// 포로 처리: 이긴/잡은 쪽이 결정
async function resolveCaptives(B) {
  const list = [...new Set(B.captives)];
  for (const id of list) {
    const o = G.officers[id];
    if (o.st !== 'on') continue;
    const mySide = B.units.find(u => u.oid === id)?.side;
    const captorF = mySide === 0 ? B.defF : mySide === 1 ? B.attF : (o.f === B.attF ? B.defF : B.attF);
    if (captorF < 0 || !G.factions[captorF].alive) { continue; }
    if (o.f === captorF) continue;
    await decideCaptive(captorF, o);
  }
  checkFactions();
}
async function decideCaptive(captorF, o) {
  const ruler = G.officers[G.factions[captorF].ruler];
  if (o.items && o.items.length) { const names = o.items.map(id => ITEM[id].name); for (const id of [...o.items]) giveItem(id, ruler); logMsg(`${facName(captorF)}군이 ${o.name}에게서 ${names.join('·')}${josa(names[names.length - 1], '을', '를').slice(-1)} 빼앗았습니다`, 'big'); }
  const P = me();
  const playerDecides = P && P.st === 'on' && P.f === captorF && isRuler(P);
  if (o.id === G.player) {
    const ch = await UI.choose({ title: '포로가 되다', portrait: ruler, text: `${facName(captorF)}군에 사로잡혔습니다. ${iga(ruler.name)} 묻습니다. "내 밑에서 일해 보지 않겠는가?"`, options: [{ k: 'yes', label: '항복하고 섬긴다' }, { k: 'no', label: '거절한다' }] });
    if (ch === 'yes') { const wasRuler = isRuler(o); const oldF = o.f; joinFaction(o, captorF, ruler.city); if (wasRuler) succession(oldF, o); logMsg(`${eun(o.name)} ${facName(captorF)}군에 항복했습니다`, 'big'); return; }
    const pExec = clamp(.15 + (60 - ruler.cha) / 180 + (isRuler(o) ? .2 : 0), .05, .6);
    if (chance(pExec)) { killOfficer(o, `${eun(o.name)} ${ruler.name}에게 처형당했습니다`); return; }
    releaseCaptive(o, captorF);
    await UI.alert({ title: '석방', text: `${eun(ruler.name)} 의기를 높이 사 풀어 주었습니다.` });
    return;
  }
  if (playerDecides) {
    const p = captiveHireChance(captorF, o);
    const ch = await UI.choose({ title: '포로 처분', portrait: o, text: `${facName(o.f)}군의 ${eul(o.name)} 사로잡았습니다.\n통솔 ${o.lead} · 무력 ${o.war} · 지력 ${o.int} · 정치 ${o.pol} · 매력 ${o.cha}`, options: [{ k: 'hire', label: `등용한다 (가능성 ${Math.round(p * 100)}%)` }, { k: 'free', label: '풀어 준다' }, { k: 'kill', label: '처단한다', danger: true }] });
    if (ch === 'hire') {
      if (chance(p)) { const wasRuler = isRuler(o), oldF = o.f; joinFaction(o, captorF, ruler.city); if (wasRuler) succession(oldF, o); await UI.alert({ title: '등용 성공', portrait: o, text: `${eun(o.name)} 고개를 숙이고 따르겠다고 합니다.` }); return; }
      await UI.alert({ title: '등용 실패', portrait: o, text: `"두 주군을 섬길 수는 없소." ${eun(o.name)} 거절했습니다. 풀어 줍니다.` });
      releaseCaptive(o, captorF); return;
    }
    if (ch === 'kill') { killOfficer(o, `${eun(o.name)} 처단되었습니다`); for (const x of factionOfficers(captorF)) x.loy = Math.max(0, x.loy - (affDist(x, o) < 10 ? 6 : 1)); return; }
    releaseCaptive(o, captorF); addRel(captorF, o.f, 5); return;
  }
  // AI 결정
  const p = captiveHireChance(captorF, o);
  if (chance(p)) { const wasRuler = isRuler(o), oldF = o.f; joinFaction(o, captorF, ruler.city); logMsg(`${eun(o.name)} 포로가 된 뒤 ${facName(captorF)}군에 들어갔습니다`); if (wasRuler) succession(oldF, o); return; }
  const pExec = clamp(.1 + (60 - ruler.cha) / 200 + (isRuler(o) ? .35 : 0), .03, .7);
  if (chance(pExec)) { killOfficer(o, `${eun(o.name)} ${facName(captorF)}군에 처형당했습니다`); return; }
  releaseCaptive(o, captorF);
}
function captiveHireChance(captorF, o) {
  if (isRuler(o)) return .03;
  const ruler = G.officers[G.factions[captorF].ruler];
  const myRuler = o.f >= 0 ? G.officers[G.factions[o.f].ruler] : null;
  if (myRuler && o.tag && o.tag === myRuler.tag) return .02;
  return clamp(.25 + (100 - o.loy) / 160 + (25 - affDist(o, ruler)) / 80 + (hasSkill(ruler, '인덕') ? .1 : 0), .05, .88);
}
function releaseCaptive(o, captorF) {
  const F = o.f >= 0 ? G.factions[o.f] : null;
  if (F && F.alive) {
    const home = G.cities.filter(c => c.f === o.f);
    if (home.length) { const c = G.cities[o.city]; if (c.gov === o.id) c.gov = -1; o.city = (home.find(h => ADJ[h.id].includes(o.city)) || home[0]).id; logMsg(`${eun(o.name)} 풀려나 ${facName(o.f)}군으로 돌아갔습니다`); assignGovs(); return; }
  }
  leaveToRonin(o);
}

// ===== 전략 AI =====
function hostileNeighbors(c) { return ADJ[c.id].map(i => G.cities[i]).filter(x => x.f !== c.f && x.f >= 0 && !isAlly(c.f, x.f)); }
function threatOf(c) { return hostileNeighbors(c).reduce((m, x) => Math.max(m, x.troops * (.6 + x.train / 250)), 0); }
function troopTarget(c) {
  const front = hostileNeighbors(c).length > 0 || ADJ[c.id].some(i => G.cities[i].f < 0);
  const base = 2000 + c.size * 2500 + (front ? 5000 : 0);
  const want = Math.max(base, Math.min(threatOf(c) * .9, base * 1.6));
  return Math.min(c.food / 0.36 + 1500, want);
}

// 도시 하나의 한 달 내정 (AI 태수)
function aiCityTurn(c) {
  const offs = officersIn(c.id, c.f).filter(o => o.id !== G.player && !o.acted);
  if (!offs.length) return;
  const threat = threatOf(c);
  // 충성 낮은 장수 포상
  for (const t of officersIn(c.id, c.f)) if (t.loy < 72 && c.gold > 350 && t.id !== G.player && !isRuler(t)) cmdReward(null, c, t);
  const byPol = [...offs].sort((a, b) => b.pol - a.pol);
  for (const o of byPol) {
    if (o.acted) continue;
    const roninHere = roninIn(c.id).filter(r => r.found && r.id !== G.player && hireChance(o, r, c.f) > .15);
    if (c.order < 45) { cmdDevelop(o, c, 'order'); continue; }
    if (c.troops < troopTarget(c) - 500 && c.gold >= 120 && c.pop > 20000) {
      const n = Math.min(draftMax(o, c), Math.max(1000, troopTarget(c) - c.troops));
      if (n >= 500 && cmdDraft(o, c, n).ok) continue;
    }
    if (roninHere.length && o.cha >= 55) { cmdHire(o, c, roninHere.sort((a, b) => (b.lead + b.war + b.int) - (a.lead + a.war + a.int))[0]); continue; }
    if (c.train < 78 && c.troops > 1500 && o.lead >= 55 && chance(.7)) { cmdTrain(o, c); continue; }
    if (c.gold >= 90) {
      const kind = c.agri / c.agriMax < c.comm / c.commMax ? 'agri' : 'comm';
      if (cmdDevelop(o, c, kind).ok) continue;
      if (cmdDevelop(o, c, kind === 'agri' ? 'comm' : 'agri').ok) continue;
    }
    if (c.wall < c.wallMax && c.gold > 260 && threat > 0 && cmdDevelop(o, c, 'wall').ok) continue;
    if (c.train < 95 && c.troops > 1000) { cmdTrain(o, c); continue; }
    cmdSearch(o, c);
  }
}

// 세력의 군사 행동: 출진 목록을 돌려줌
function aiPlanAttacks(F) {
  const ruler = G.officers[F.ruler];
  const aggr = .85 + (ruler.war - 60) / 160 - (ruler.int - 60) / 400;
  const plans = [];
  const graceForPlayer = mIdx() - (G.start || 0) <= DIFF().grace;
  const pf = me() && me().st === 'on' ? me().f : -2;
  for (const c of G.cities.filter(x => x.f === F.id)) {
    if (playerControls(c)) continue;
    const offs = officersIn(c.id, F.id).filter(o => o.id !== G.player && !o.busyWar);
    if (!offs.length) continue;
    const targets = ADJ[c.id].map(i => G.cities[i]).filter(t => t.f !== F.id && !isAlly(F.id, t.f) && !plans.some(p => p.to === t));
    let bestT = null, bestS = 0;
    for (const t of targets) {
      if (t.f === pf && graceForPlayer) continue;
      const tOffs = t.f >= 0 ? officersIn(t.id, t.f) : [];
      if (t.f < 0 || !tOffs.length) {
        if (c.troops >= 5000 && offs.length >= 2 && histEmptyOK(F, t)) { const s = 2 + t.size; if (s > bestS) { bestS = s; bestT = t; } }
        continue;
      }
      const top = [...offs].sort((a, b) => (b.lead + b.war) - (a.lead + a.war)).slice(0, 5);
      const myQ = top.reduce((a, o) => a + o.lead * .55 + o.war * .45, 0) / top.length;
      const thQ = tOffs.slice(0, 5).reduce((a, o) => a + o.lead * .6 + o.int * .2 + o.war * .2, 0) / Math.min(5, tOffs.length);
      const myPow = c.troops * .75 * myQ * (.6 + c.train / 250);
      const tEff = Math.min(t.troops, tOffs.slice(0, 5).reduce((a, o) => a + troopCap(o), 0));
      const thPow = tEff * thQ * (.6 + t.train / 250) * (1.15 + Math.min(.5, t.wall / 2000));
      const ratio = myPow / Math.max(1, thPow);
      const need = Math.max(.95, DIFF().base / aggr - Math.min(.35, (F.idle || 0) * .015)) + (t.f === pf ? DIFF().vsP : 0) + histNeed(F, t);
      if (ratio > need && c.food > c.troops * .3) { const s = ratio * (1 + t.size / 5) + (getRel(F.id, t.f) < 30 ? .3 : 0); if (s > bestS) { bestS = s; bestT = t; } }
    }
    if (!bestT) continue;
    const empty = bestT.f < 0 || !officersIn(bestT.id, bestT.f).length;
    let army;
    if (empty) {
      const o = [...offs].sort((a, b) => (a.lead + a.war) - (b.lead + b.war))[Math.min(1, offs.length - 1)];
      if (o.id === c.gov && offs.length > 1) continue;
      army = [{ oid: o.id, troops: Math.min(Math.floor(c.troops * .35 / 100) * 100, 4000), type: autoType(o) }];
    } else {
      const pool = offs.filter(o => o.id !== c.gov);
      if (!pool.length) continue; // 태수는 성을 지킴
      let top = [...pool].sort((a, b) => (b.lead + b.war) - (a.lead + a.war)).slice(0, 5);
      // 플레이어가 이 성의 장수면 데려갈 수 있음
      const P = me();
      if (P && P.st === 'on' && P.f === F.id && P.city === c.id && !P.travel && !isRuler(P) && c.gov !== P.id && top.length < 5 && (P.lead + P.war > 110 || chance(.5))) top.push(P);
      const tr = splitTroops(top, Math.floor(c.troops * .78));
      army = top.map((o, i) => ({ oid: o.id, troops: tr[i], type: autoType(o) })).filter(u => u.troops >= 500);
      if (!army.length) continue;
      // 목표에 붙은 다른 우리 성에서도 함께 출진 (협공)
      for (const s of attackSources(c, bestT).slice(1)) {
        if (army.length >= 5) break;
        if (playerControls(s) || s.troops < 5000) continue;
        const so = officersIn(s.id, F.id).filter(o => o.id !== s.gov && o.id !== G.player && !o.busyWar).sort((a, b) => (b.lead + b.war) - (a.lead + a.war))[0];
        if (!so || !chance(.8)) continue;
        const t = Math.min(troopCap(so), Math.floor(s.troops * .45 / 100) * 100);
        if (t >= 1500) army.push({ oid: so.id, troops: t, type: autoType(so), src: s.id });
      }
      // 성벽이 두꺼우면 가장 약한 부대가 충차를 끔
      if (army.length >= 3 && bestT.wall >= 380 && chance(.6)) { const w = army.reduce((m, u) => G.officers[u.oid].war < G.officers[m.oid].war ? u : m, army[army.length - 1]); if (w !== army[0] && w.oid !== G.player) w.type = 'ram'; }
    }
    const tot = army.reduce((a, u) => a + u.troops, 0);
    const food = Math.min(attackSources(c, bestT).filter(s => s === c || army.some(u => u.src === s.id)).reduce((a, s) => a + s.food, 0), Math.ceil(tot * 32 / 80));
    plans.push({ from: c, to: bestT, army, food });
  }
  return plans;
}

// 목표를 정하고 병력·장수를 집결지로 모음
function aiLogistics(F) {
  const cs = G.cities.filter(x => x.f === F.id && !playerControls(x));
  if (!cs.length) return;
  const pf = me() && me().st === 'on' ? me().f : -2;
  const grace = mIdx() - (G.start || 0) <= DIFF().grace;
  let tgt = F.target != null ? G.cities[F.target] : null;
  const bad = t => !t || t.f === F.id || isAlly(F.id, t.f) || !ADJ[t.id].some(i => G.cities[i].f === F.id) || (grace && t.f === pf);
  const fT = focusTargets(F.id);
  if (bad(tgt) || chance(.04) || (fT.length && tgt && !fT.includes(tgt.f) && chance(.3))) {
    let best = null, bs = 1e18;
    for (const c of G.cities.filter(x => x.f === F.id)) for (const i of ADJ[c.id]) {
      const t = G.cities[i]; if (t.f === F.id || isAlly(F.id, t.f) || (grace && t.f === pf)) continue;
      if (t.f < 0 && !histEmptyOK(F, t)) continue;
      const s = (t.f < 0 ? 0 : t.troops * (1.15 + t.wall / 2000)) - t.size * 1500 + rand() * 3000 + histTargetBias(F, t);
      if (s < bs) { bs = s; best = t; }
    }
    F.target = best ? best.id : null; tgt = best;
  }
  if (!tgt) return;
  const stage = ADJ[tgt.id].map(i => G.cities[i]).filter(x => x.f === F.id).sort((a, b) => b.troops - a.troops)[0];
  if (!stage) return;
  const next = { [stage.id]: -1 }, q = [stage.id];
  while (q.length) { const a = q.shift(); for (const b of ADJ[a]) if (G.cities[b].f === F.id && next[b] === undefined) { next[b] = a; q.push(b); } }
  for (const c of cs) {
    if (c === stage || next[c.id] === undefined) continue;
    const to = G.cities[next[c.id]];
    const keep = Math.max(2500, threatOf(c) * .55);
    const offs = officersIn(c.id, F.id).filter(o => o.id !== G.player);
    if (c.troops - keep >= 1500 && offs.length) cmdTransport(offs.find(o => o.id !== c.gov) || offs[0], c, to, Math.max(0, c.gold - 400), Math.max(0, c.food - Math.max(5000, c.troops * .4)), c.troops - keep);
    const free = offs.filter(o => o.id !== c.gov && !isRuler(o));
    if (free.length >= 2 || (free.length === 1 && threatOf(c) === 0)) cmdMove(free.sort((a, b) => (b.war + b.lead) - (a.war + a.lead))[0], to.id);
  }
}

// 외교
function aiDiplomacy(F) {
  const others = G.factions.filter(x => x.alive && x.id !== F.id);
  const myCities = G.cities.filter(c => c.f === F.id);
  const neighbors = new Set(); myCities.forEach(c => ADJ[c.id].forEach(i => { const f = G.cities[i].f; if (f >= 0 && f !== F.id) neighbors.add(f); }));
  for (const o of others) {
    if (isAlly(F.id, o.id)) {
      if (getRel(F.id, o.id) < 25 && chance(.15) && !(G.marry && G.marry[relKey(F.id, o.id)])) breakAlly(F.id, o.id);
      continue;
    }
    if (!neighbors.has(o.id) && chance(.04)) addRel(F.id, o.id, 3);
    var pf = me() && me().st === 'on' && isRuler(me()) ? me().f : -2;
    const common = [...neighbors].some(n => n !== o.id && G.cities.some(c => c.f === o.id && ADJ[c.id].some(i => G.cities[i].f === n)) && factionPower(n) > factionPower(F.id));
    if (getRel(F.id, o.id) >= 70 && (common || o.id === pf) && chance(.05)) {
      if (o.id === pf) { G.pendingOffers = G.pendingOffers || []; G.pendingOffers.push({ from: F.id, kind: 'ally' }); }
      else { makeAlly(F.id, o.id); logMsg(`${F.name}군과 ${o.name}군이 동맹을 맺었습니다`, 'dip'); }
    }
  }
}

// 재야 장수들의 떠돌기, 낮은 충성 이탈
function aiOfficersDrift() {
  for (const o of G.officers) {

  }
}

let BUSY = false;
async function endMonth() {
  if (BUSY || G.over) return;
  BUSY = true; UI.busy(true);
  try {
    // 1) AI 내정
    for (const c of G.cities) if (c.f >= 0 && !playerControls(c)) aiCityTurn(c);
    // 2) AI 외교·물자
    for (const F of G.factions) if (F.alive && !(isRuler(me()) && me().f === F.id)) { aiDiplomacy(F); aiLogistics(F); }
    if (isRuler(me())) { for (const c of G.cities) if (c.f === me().f && c.deleg) aiCityTurn(c); aiLogisticsDeleg(); }
    // 3) 출진
    let plans = [];
    for (const F of shuffle(G.factions.filter(f => f.alive))) {
      if (isRuler(me()) && me().f === F.id) { plans.push(...aiPlanAttacks(F).filter(p => p.from.deleg)); continue; }
      plans.push(...aiPlanAttacks(F));
    }
    const warUsed = new Set();
    for (const p of plans) {
      if (p.from.f < 0 || G.officers[p.army[0].oid].city !== p.from.id) continue; // 상황이 바뀜
      if (p.to.f === p.from.f || isAlly(p.from.f, p.to.f)) continue;
      p.army = p.army.filter(u => { const s = u.src ?? p.from.id, o = G.officers[u.oid]; return G.cities[s].f === p.from.f && o.st === 'on' && o.f === p.from.f && o.city === s && !o.travel && !warUsed.has(o.id); });
      const need = {}; for (const u of p.army) need[u.src ?? p.from.id] = (need[u.src ?? p.from.id] || 0) + u.troops;
      if (!p.army.length || Object.entries(need).some(([id, t]) => G.cities[id].troops < t)) continue;
      for (const u of p.army) warUsed.add(u.oid);
      G.factions[p.from.f].idle = 0;
      await runWar(p.from, p.to, p.army, p.food);
      if (G.over) return;
    }
    for (const F of G.factions) if (F.alive) F.idle = (F.idle || 0) + 1;
    for (const k in G.ally) if (G.ally[k] !== true && G.ally[k] <= mIdx()) { const [a, b] = k.split(',').map(Number); delete G.ally[k]; logMsg(`${facName(a)}군과 ${facName(b)}군의 동맹 기한이 끝났습니다`, 'dip'); }
    checkFactions();
    // 4) 달 넘김
    monthlyEconomy();
    await monthlyEvents();
    G.month++;
    MapView.monthBanner();
    monthlyTravel();
    if (G.month > 12) { G.month = 1; G.year++; await yearlyEvents(); }
    await runEvents();
    monthlyMission();
    for (const o of G.officers) o.acted = false;
    G.ap = me() && me().travel ? 0 : 3;
    assignGovs();
    aiOfficersDrift();
    await afterMonthChecks();
    if (!G.over) saveGame('auto');
    SFX.play('gong');
  } catch (e) { console.error(e); UI.toast('오류: ' + e.message); }
  finally { BUSY = false; UI.busy(false); UI.refresh(); }
}
function aiLogisticsDeleg() {
  const F = G.factions[me().f];
  // 위임한 성만: playerControls가 false인 성만 움직이므로 그대로 호출
  aiLogistics(F);
}

// 전쟁 하나를 처리 (플레이어가 끼면 직접 지휘)
async function runWar(from, to, army, food, extra = {}) {
  const defF = to.f, attF = from.f;
  const srcIds = [...new Set(army.map(u => u.src ?? from.id))];
  await Promise.all(srcIds.map(id => MapView.march(id, to.id, attF)));
  const B = launchAttack(from, to, army, food, extra);
  if (!B) { MapView.flash(to.id, '입성', facColor(attF)); UI.refresh(); return; }
  const P = me();
  if (extra.title) B.title = extra.title;
  gatherReinforce(B, to);
  const pIn = P && P.st === 'on' && B.units.some(u => u.oid === P.id);
  const pDefends = P && P.st === 'on' && P.f === defF && defF >= 0 && (playerControls(to) || (P.city === to.id));
  const pAttacks = P && P.st === 'on' && P.f === B.attF && (playerControls(from) || pIn);
  if (pIn || pDefends || pAttacks) {
    B.playerSide = (P.f === B.attF) ? 0 : 1;
    const full = (B.playerSide === 0 && playerControls(from) && (role() === 'ruler' || role() === 'gov')) || (B.playerSide === 1 && playerControls(to));
    B.ctrl = u => u.side === B.playerSide && (full || u.oid === P.id);
    if (!full && !pIn && B.playerSide === 1) { // 지켜보기만
      B.ctrl = () => false;
    }
    await UI.alert({ title: B.playerSide === 0 ? '출진' : '적의 침공!', text: B.playerSide === 0 ? `${facName(B.attF)}군 ${fmt(B.units.filter(u => u.side === 0).reduce((a, u) => a + u.troops, 0))}명이 ${eul(to.name)} 공격합니다.${!full ? '\n당신은 자기 부대만 지휘합니다.' : ''}` : `${facName(B.attF)}군이 ${eul(to.name)} 공격해 왔습니다!${!full && pIn ? '\n당신은 자기 부대만 지휘합니다.' : ''}${!pIn && !full ? '\n싸움을 지켜봅니다.' : ''}` });
    await BattleUI.run(B);
  } else {
    runBattleHeadless(B);
  }
  if (extra.post) extra.post(B);
  returnAllies(B);
  applyBattle(B);
  MapView.flash(to.id, B.result.win === 0 ? '함락' : '격퇴', facColor(B.result.win === 0 ? attF : defF));
  await resolveCaptives(B);
  if (P && B.playerSide != null) {
    const won = B.result.win === B.playerSide;
    if (won) SFX.play('win'); else SFX.play('lose');
  }
  if (P && (pIn || pDefends || pAttacks)) {
    await UI.alert({ title: B.result.win === B.playerSide ? '승리' : '패배', text: `${B.title || to.name + ' 전투'} — ${B.result.why}.` });
  }
  checkFactions();
}

function monthlyEconomy() {
  for (const c of G.cities) {
    if (c.f >= 0) {
      const pf = me() && me().st === 'on' ? me().f : -2;
      const inc = c.f === pf ? DIFF().pInc : DIFF().aiInc;
      c.gold += Math.round((c.comm / 4 + c.pop / 25000) * inc);
      c.food -= Math.round(c.troops * .03);
      if (G.month === 7) c.food += Math.round(c.agri * 22 * (.55 + c.order / 220) * inc);
      if (c.troops > troopMax(c)) { const loss = Math.round((c.troops - troopMax(c)) * .3); c.troops -= loss; c.pop += loss; }
      if (c.food < 0) { const loss = Math.round(c.troops * .25); c.troops -= loss; c.food = 0; if (c.f === me()?.f) logMsg(`${c.name}에 군량이 떨어져 병사 ${fmt(loss)}명이 달아났습니다`, 'bad'); }
      if (c.gold > 30000) c.gold = 30000;
    } else {
      c.gold += 20; if (G.month === 7) c.food += Math.round(c.agri * 8);
    }
    c.pop = Math.round(c.pop * (1 + (c.order - 45) / 6000));
    if (chance(.3)) c.order = clamp(c.order + (c.order > 60 ? -1 : 0) + (c.troops > 2000 ? 0 : -1), 0, 100);
    c.troops = Math.max(0, c.troops);
  }
  // 충성 흐름
  for (const o of G.officers) {
    if (o.st !== 'on' || isRuler(o) || o.id === G.player) continue;
    const r = G.officers[G.factions[o.f].ruler];
    if (o.tag && o.tag === r.tag) { o.loy = 100; continue; }
    const drift = (r.cha - 65) / 40 - affDist(o, r) / 40 + (hasSkill(r, '인덕') ? .6 : 0);
    if (chance(.4)) o.loy = clamp(Math.round(o.loy + drift + (chance(.5) ? 0 : -1)), 0, 100);
  }
  // 플레이어 봉록
  const P = me();
  if (P && P.st === 'on') G.pgold += isRuler(P) ? 0 : 20 + Math.floor(P.merit / 100);
}

async function monthlyEvents() {
  // 동맹 제의
  const offers = G.pendingOffers || []; G.pendingOffers = [];
  for (const of of offers) {
    if (!isRuler(me())) break;
    const F = G.factions[of.from]; if (!F.alive || isAlly(F.id, me().f)) continue;
    const ch = await UI.choose({ title: '동맹 제의', portrait: G.officers[F.ruler], text: `${F.name}군의 사자가 왔습니다. "우리 두 나라가 3년 동안 손을 잡는 것이 어떻겠습니까?"`, options: [{ k: 'y', label: '동맹을 맺는다' }, { k: 'n', label: '거절한다' }] });
    if (ch === 'y') { makeAlly(F.id, me().f); logMsg(`${F.name}군과 동맹을 맺었습니다`, 'dip'); }
    else addRel(F.id, me().f, -8);
  }
  // 태수 임명 알림
  const P = me();
  if (P && P.st === 'on' && !isRuler(P)) {
    const c = G.cities[P.city];
    if (c.gov !== P.id) {
      const gov = c.gov >= 0 ? G.officers[c.gov] : null;
      if (P.merit >= 700 && (!gov || (!isRuler(gov) && govScore(P) > govScore(gov) * .95)) && chance(.5)) {
        c.gov = P.id;
        await UI.alert({ title: '태수 임명', portrait: G.officers[G.factions[P.f].ruler], text: `그간의 공을 인정받아 ${c.name} 태수로 임명되었습니다.\n이제 이 성의 내정과 군사를 맡습니다.` });
        logMsg(`${eun(P.name)} ${c.name} 태수가 되었습니다`, 'big');
      }
    }
  }
}

async function yearlyEvents() {
  // 수명
  for (const o of G.officers) {
    if ((o.st === 'on' || o.st === 'ronin') && G.year >= o.die && chance(.65)) {
      const notable = o.id === G.player || isRuler(o) || (me() && o.f === me().f && o.f >= 0);
      killOfficer(o, notable ? `${eun(o.name)} 병으로 세상을 떠났습니다 (향년 ${age(o)}세)` : null);
    }
  }
  // 새 인물 등장
  for (const o of G.officers) {
    if (o.st !== 'unborn' || G.year - o.born < 16) continue;
    const F = o.fk ? G.factions.find(f => f.key === o.fk && f.alive) : null;
    if (F) { o.st = 'on'; o.f = -1; joinFaction(o, F.id, G.officers[F.ruler].city); logMsg(`${eun(o.name)} 자라서 ${F.name}군에 들어왔습니다`); }
    else { o.st = 'ronin'; o.f = -1; o.found = false; }
  }
  spawnTalents();
  checkFactions();
  assignGovs();
  await checkHegemon();
}

async function afterMonthChecks() {
  const P = me();
  if (!P || P.st === 'dead') return;
  // 통일
  const alive = G.factions.filter(f => f.alive && G.cities.some(c => c.f === f.id));
  const owned = G.cities.filter(c => c.f >= 0);
  if (alive.length === 1 && owned.length === G.cities.length) {
    const F = alive[0];
    G.over = true;
    const mine = P.st === 'on' && P.f === F.id;
    await UI.alert({ title: mine ? '천하 통일!' : '천하가 정해지다', portrait: G.officers[F.ruler], text: mine ? `${G.year}년 ${G.month}월, ${F.name}군이 천하를 하나로 모았습니다.\n${P.name}의 이름은 길이 전해질 것입니다.` : `${F.name}군이 천하를 통일했습니다.` });
    UI.gameOver(mine);
  }
}

// 플레이어가 죽었을 때
function onPlayerDeath(o, f, wasRuler) {
  if (wasRuler && f >= 0 && G.factions[f].alive) {
    const n = G.officers[G.factions[f].ruler];
    if (n && n.st === 'on') {
      G.player = n.id;
      UI.queue({ title: '대를 잇다', portrait: n, text: `${eun(o.name)} 세상을 떠났습니다. 이제 ${iga(n.name)} 뜻을 이어 세력을 이끕니다.` });
      return;
    }
  }
  UI.queue({ title: '영웅의 죽음', portrait: o, text: `${eun(o.name)} 세상을 떠났습니다.\n다른 인물로 이어서 할 수 있습니다.`, after: () => UI.pickSuccessor() });
}

// ===== 새 인재: 역사 속 인물이 줄어들면 해마다 이름 없는 인재가 재야에 나타남 =====
const GEN_SUR = '왕 이 장 유 진 양 황 주 오 서 손 마 호 곽 하 고 임 정 한 조 위 채 반 송 소 노 엄 공 우 육 염 방 전 설 허 맹 두 여 범 문 석 견 화 동 부 신'.split(' ');
const GEN_GIV = '위 문 무 덕 량 휘 충 의 현 소 원 표 승 홍 기 연 강 준 영 평 백 숙 계 언 경 보 양 익 수 진 명 상 도 안 태 웅 성 장 공 달 용 패 녕 광 규 림 순 탁 융 의'.split(' ');
function genName() {
  const used = new Set(G.officers.map(o => o.name));
  for (let k = 0; k < 200; k++) { const n = pick(GEN_SUR) + pick(GEN_GIV) + (chance(.25) ? pick(GEN_GIV) : ''); if (!used.has(n) && n.length >= 2) return n; }
  return null;
}
function spawnTalents() {
  const living = G.officers.filter(o => o.st === 'on' || o.st === 'ronin').length;
  const target = 95;
  if (living >= target) return 0;
  const n = Math.min(6, Math.ceil((target - living) / 4)) + (chance(.4) ? 1 : 0);
  const owned = G.cities.filter(c => c.f >= 0);
  let made = 0;
  for (let i = 0; i < n; i++) {
    const name = genName(); if (!name) break;
    const kind = pick(['war', 'war', 'civ', 'civ', 'mix']), r = (a, b) => ri(a, b);
    const st = kind === 'war' ? { lead: r(55, 84), war: r(60, 88), int: r(25, 60), pol: r(20, 55), cha: r(35, 75) }
      : kind === 'civ' ? { lead: r(35, 70), war: r(20, 50), int: r(60, 88), pol: r(55, 88), cha: r(40, 80) }
      : { lead: r(48, 78), war: r(45, 78), int: r(45, 78), pol: r(45, 78), cha: r(45, 80) };
    if (chance(.06)) { const k = kind === 'civ' ? ['int', 'pol'] : ['lead', 'war']; for (const x of k) st[x] = Math.min(96, st[x] + ri(6, 12)); } // 드물게 뛰어난 인재
    const city = pick(chance(.8) && owned.length ? owned : G.cities);
    const born = G.year - ri(17, 26);
    G.officers.push({ id: G.officers.length, name, born, die: born + ri(52, 74), ...st, f: -1, city: city.id, loy: 0, merit: 0, fame: ri(5, 30), st: 'ronin', acted: false, ideal: ri(0, 99), tag: '', found: false, home: city.id, fk: '', gen: kind, bond: {} });
    made++;
  }
  if (made) logMsg(`새로운 인재 ${made}명이 세상에 나타났다는 소문입니다`);
  return made;
}

// ===== 역사 사건 =====
// 각 사건은 한 번만 일어남. cond()가 참이 되는 달에 run()을 실행.
// 선택지의 첫 번째는 언제나 역사대로 흘러가는 쪽(자동 시험도 이쪽을 고름).
const byName = n => G.officers.find(o => o.name === n);
const live = o => !!o && (o.st === 'on' || o.st === 'ronin');
const onIn = (o, f) => !!o && o.st === 'on' && o.f === f;
const rulerNamed = n => { const o = byName(n); return o && o.st === 'on' && isRuler(o) ? o : null; };
const isP = o => !!o && o.id === G.player;
const facAdj = (a, b) => G.cities.some(c => c.f === a && ADJ[c.id].some(i => G.cities[i].f === b));
const cityN = n => G.cities[CITY_BY_NAME[n]];
const scenesOn = () => store('gunung.scenes') !== '0';

// 장면 보여 주기. 당사자가 아니고 장면을 꺼 두었으면 첫 선택지를 돌려줌
async function scene({ title, lines, options, involved }) {
  // 연표에 남김 (나중에 다시 보기)
  G.chron = G.chron || [];
  const rec = { d: `${G.year}.${G.month}`, title, lines: lines.map(([w, t, a]) => [w ? w.name : null, w ? t : (a || t)]) };
  const last = G.chron[G.chron.length - 1];
  if (last && last.title === title && last.d === rec.d) last.lines.push(...rec.lines); else G.chron.push(rec);
  if (!involved && !scenesOn()) return options ? options[0].k : 'ok';
  const body = el('div', { class: 'scene' },
    el('div', { class: 'eyebrow' }, `${G.year}년 ${G.month}월 · 역사 사건`),
    lines.map(([who, text, alt]) => who
      ? el('div', { class: 'sline' }, portraitImg(who, ''), el('div', { class: 'say' }, el('b', { class: 'disp' }, who.name), el('p', {}, text)))
      : el('p', { class: 'nar' }, alt || text)));
  SFX.play('gong');
  if (!options) { await UI.modal({ title, body, wide: true, buttons: [{ k: 'ok', label: '계속', cls: 'pri' }] }); return 'ok'; }
  return UI.modal({ title, body, wide: true, col: options.length > 2, buttons: options.map((o, i) => ({ k: o.k, label: o.label, cls: i === 0 ? 'pri' : '', danger: o.danger })) });
}

// 세력 합치기 (서주 양도)
function mergeFaction(from, to) {
  for (const c of G.cities) if (c.f === from) { c.f = to; c.gov = -1; c.deleg = false; }
  for (const o of G.officers) if (o.st === 'on' && o.f === from) { const cid = o.city; joinFaction(o, to, cid); o.acted = false; }
  G.factions[from].alive = false;
  for (const k in G.ally) if (k.split(',').map(Number).includes(from)) delete G.ally[k];
  assignGovs();
}
// 한 성을 들고 갈라져 나가기 (연환계 뒤 여포)
function splitOff(leader, c, oldF, followers) {
  const home = G.cities.filter(x => x.f === oldF && x.id !== c.id);
  for (const o of officersIn(c.id, oldF)) {
    if (o === leader || followers.includes(o)) continue;
    if (home.length) o.city = (home.find(h => ADJ[h.id].includes(c.id)) || home[0]).id; else leaveToRonin(o);
  }
  leaveToRonin(leader);
  const F = createFaction(leader, c, c.troops, true);
  for (const f of followers) { if (c.gov === f.id) c.gov = -1; f.st = 'on'; f.f = F.id; f.city = c.id; f.loy = 90; }
  G.rel[relKey(F.id, oldF)] = 0;
  assignGovs();
  return F;
}

async function replayChron(rec) {
  const body = el('div', { class: 'scene' }, el('div', { class: 'eyebrow' }, `${rec.d.replace('.', '년 ')}월 · 연표`),
    rec.lines.map(([n, text]) => { const who = n ? byName(n) : null; return who ? el('div', { class: 'sline' }, portraitImg(who, ''), el('div', { class: 'say' }, el('b', { class: 'disp' }, who.name), el('p', {}, text))) : el('p', { class: 'nar' }, text); }));
  await UI.modal({ title: rec.title, body, wide: true, cancel: 'x', buttons: [{ k: 'x', label: '닫기', cls: 'pri' }] });
}
async function runEvents() {
  G.ev = G.ev || {};
  for (const ev of EVENTS) {
    if (G.ev[ev.id] || G.over) continue;
    let ok = false;
    try { ok = !!ev.cond(); } catch (e) { console.error('사건 조건 오류', ev.id, e); }

  const old = c.f;

// 적벽의 싸움터: 조조의 성(강릉 우선)과 이웃한 손권의 성(시상·강하·여강 우선)
function chibiFront(cf, qf) {
  const fromPref = ['강릉', '양양', '강하', '여강', '수춘', '여남'];
  const toPref = ['시상', '강하', '여강', '건업', '장사', '강릉'];
  // 장강을 따라 내려오는 길: 강릉·양양 → 시상·강하 (이웃이 아니어도 물길로)
  for (const [fn, tn] of [['강릉', '시상'], ['강릉', '강하'], ['양양', '시상'], ['강하', '시상']]) { const f = cityN(fn), t = cityN(tn); if (f.f === cf && t.f === qf) return [f, t]; }
  for (const tn of toPref) { const t = cityN(tn); if (t.f !== qf) continue; for (const fn of fromPref) { const f = cityN(fn); if (f.f === cf && ADJ[f.id].includes(t.id)) return [f, t]; } }
  for (const t of G.cities) if (t.f === qf) { const f = ADJ[t.id].map(i => G.cities[i]).find(x => x.f === cf); if (f) return [f, t]; }
  return null;
}

const monthsLabel = m => m <= 0 ? '이번 달' : `${m}달`;
const incomingTroops = cid => (G.convoys || []).filter(v => v.to === cid).reduce((a, v) => a + v.troops, 0);
const UI = {
  sel: -1, q: [], modalOpen: false,
  toast(t) { const e = $('#toast'); e.textContent = t; e.classList.add('on'); clearTimeout(this._tt); this._tt = setTimeout(() => e.classList.remove('on'), 2200); },
  busy(on) { $('#busy').classList.toggle('on', on); },
  // 모달: 버튼 키를 돌려줌
  modal({ title, portrait, text, body, buttons = [{ k: 'ok', label: '확인', cls: 'pri' }], wide, col, cancel }) {
    return new Promise(res => {
      const layer = $('#modalLayer');
      const done = k => { layer.classList.remove('on'); layer.innerHTML = ''; this.modalOpen = false; document.removeEventListener('keydown', onKey); res(k); };
      const onKey = e => { if (e.key === 'Escape' && cancel) done(cancel); if (e.key === 'Enter' && buttons.length === 1 && !e.target.matches('input')) done(buttons[0].k); };
      const box = el('div', { class: 'modal' + (wide ? ' wide' : ''), role: 'dialog', 'aria-modal': 'true' },
        el('header', {}, el('h4', {}, title || ''), cancel ? el('button', { class: 'btn sm ghost', onclick: () => done(cancel), 'aria-label': '닫기' }, icon('close')) : null),
        el('div', { class: 'body' },
          (text || portrait) ? el('div', { class: 'msg' }, portrait ? portraitImg(portrait) : null, text ? el('div', {}, text) : null) : null,
          body || null),
        buttons.length ? el('footer', { class: col ? 'col' : '' }, buttons.map(b => el('button', { class: 'btn ' + (b.cls || (b.danger ? 'red' : '')), disabled: b.disabled, onclick: () => { if (b.check && !b.check()) return; done(typeof b.k === 'function' ? b.k() : b.k); } }, b.label))) : null);
      layer.innerHTML = ''; layer.append(box); layer.classList.add('on'); this.modalOpen = true;
      document.addEventListener('keydown', onKey);
      setTimeout(() => { const f = box.querySelector('footer .btn.pri, footer .btn'); f && f.focus(); }, 30);
      this._close = done;
    });
  },

const SFX = {
  ctx: null, on: store('gunung.snd') !== '0',
  ensure() { if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { this.on = false; } } if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); return this.ctx; },
  toggle() { this.on = !this.on; store('gunung.snd', this.on ? '1' : '0'); },
  tone(f, t0, dur, type = 'sine', vol = .15, f2) {

    g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vol, t0 + .01); g.gain.exponentialRampToValueAtTime(.0005, t0 + dur);
    o.connect(g).connect(c.destination); o.start(t0); o.stop(t0 + dur + .05);

  noise(t0, dur, vol = .2, ftype = 'bandpass', freq = 1200, q = 1, f2) {
